<body>
<div id="app"></div>
<script src="js/config.js" charset="utf-8"></script>
<script src="js/gate.js" charset="utf-8"></script><script src="js/dialog.js" data-lang="en" charset="utf-8"></script><script src="js/examcalc.js" charset="utf-8"></script>
<script>
Gate.start({kinds:[],bare:true},function(ctx){
'use strict';
const sb=Gate.sb,el=Gate.el,app=document.getElementById('app');
const NAME=(ctx.profile&&ctx.profile.name)||'';
const STAGE_PARAM=parseInt(new URLSearchParams(location.search).get('stage'),10)||0;
let MOCK=null;const QS=new URLSearchParams(location.search);let stage=0,items=null,answers={},part=0,t0=0,endIn=0,tick=null,dirty=false,saving=false,sent=false,lastSave=0;
const PART_NAME={dictation:'Dictation',yesno:'Yes / No quiz',oral:'Listening',gap:'Gap fill',mc:'Multiple choice',err:'Error correction'};
function clear(){app.textContent='';}
function mmss(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function left(){return Math.max(0,Math.round(endIn-(performance.now()-t0)/1000));}

/* ---------- plain screens ---------- */
function screen(children){clear();app.append(el('main',{style:'padding-bottom:30px'},...children));window.scrollTo(0,0);}
function logo(){return el('div',{class:'lock',role:'img','aria-label':'Britland Academy'},el('img',{src:'img/britland-shield.png',alt:''}),el('span',{class:'nm'},el('b',{},'BRITLAND'),el('i',{},'ACADEMY')));}
function mockLink(){return el('a',{class:'btnl',href:'exam.html?mock=1',style:'background:#fff;color:var(--navy);border-color:var(--navy)'},'Mock tests');}
function leave(){return el('a',{class:'btnl',href:'index.html'},'Back to the activities');}

async function home(){
  if(QS.get('teach'))return teachBegin();
  if(QS.get('mock')){const ms=parseInt(QS.get('stage'),10),mt=QS.get('test');return (ms&&(mt==='A'||mt==='B'))?mockIntro(ms,mt):mockHome();}
  const r=await sb.from('exam_release').select('stage').order('stage');
  const rel=(r.data||[]).map(x=>x.stage);
  if(!rel.length){screen([el('div',{class:'scr center'},logo(),el('h1',{},'No exam is open yet'),el('p',{},'Your teacher will open the Stage Exam for you when you have finished the Lesson Checks of your Stage.'),el('p',{},'In the meantime, you can practise with a mock test.'),el('p',{style:'display:flex;gap:10px;flex-wrap:wrap;justify-content:center'},mockLink(),leave()))]);return;}
  if(STAGE_PARAM&&rel.includes(STAGE_PARAM))return openStage(STAGE_PARAM);
  const sts={};for(const n of rel)sts[n]=(await sb.rpc('exam_state',{p_stage:n})).data||{};
  const run=rel.find(n=>sts[n].state==='running');if(run)return openStage(run); // prova em andamento (recarregou a página): continua de onde parou
  const box=el('div',{});
  for(const n of rel){const st=sts[n];
    box.append(el('p',{style:'display:flex;justify-content:space-between;align-items:center;gap:10px'},el('b',{},'Stage '+n+' Exam'),el('span',{},st.state==='done'?'Submitted':(st.state==='running'?'In progress':'Ready')),el('a',{class:'btnl',href:'exam.html?stage='+n},st.state==='done'?'Open':'Start')));}
  screen([el('div',{class:'scr'},logo(),el('h1',{},'Your exams'),box,el('p',{style:'display:flex;gap:10px;flex-wrap:wrap'},mockLink(),leave()))]);
}
async function openStage(n){
  stage=n;
  const r=await sb.rpc('exam_state',{p_stage:n});
  if(r.error){screen([el('div',{class:'scr'},el('h1',{},'Could not load the exam'),el('p',{class:'msg-bad'},r.error.message))]);return;}
  const st=r.data||{};
  if(st.state==='done')return finished(st);
  if(st.state==='running')return begin();
  if(st.state==='ready')return intro(st);
  screen([el('div',{class:'scr center'},logo(),el('h1',{},'This exam is not open'),el('p',{},'Please ask your teacher.'),el('p',{},leave()))]);
}
function intro(st){
  const ok=el('input',{type:'checkbox',id:'ok',style:'width:22px;height:22px'});
  const go=el('button',{type:'button',class:'xnext',disabled:true},'Start the exam');
  ok.addEventListener('change',()=>{go.disabled=!ok.checked;});
  go.addEventListener('click',()=>{go.disabled=true;begin();});
  screen([el('div',{class:'scr'},logo(),el('h1',{class:'center'},'Stage '+stage+' Exam'),
    el('ul',{},
      el('li',{},el('b',{},st.minutes+' minutes'),' in total. The timer starts when you press the button.'),
      el('li',{},'The exam has parts. You go from one part to the next and ',el('b',{},'you cannot go back'),' to a finished part.'),
      el('li',{},'Your teacher reads the dictation and the listening questions aloud, so stay with your teacher.'),
      el('li',{},'You can do the exam only once. Your answers are saved automatically. When you reach the last part, the ',el('b',{},'End exam'),' button appears. Press it when you finish.'),
      el('li',{},'Do not close this page, press Back or reload.')),
    el('p',{},el('label',{style:'display:flex;gap:10px;align-items:center;font-weight:700'},ok,'I am with my teacher and ready to start.')),
    el('p',{class:'center'},go))]);
}

/* ---------- exam ---------- */
async function begin(){
  const r=await sb.rpc('exam_begin',{p_stage:stage});
  if(r.error){screen([el('div',{class:'scr'},el('h1',{},'Could not start the exam'),el('p',{class:'msg-bad'},r.error.message))]);return;}
  items=r.data.items;answers=r.data.answers||{};part=Math.min(r.data.part_idx||0,items.parts.length-1);
  t0=performance.now();endIn=r.data.seconds_left;
  window.addEventListener('beforeunload',e=>{if(!sent){e.preventDefault();e.returnValue='';}});
  shell();draw();
  tick=setInterval(onTick,500);onTick();
}
function onTick(){
  const s=left(),t=document.getElementById('tm'),box=document.getElementById('tbox');
  if(t){t.textContent=mmss(s);}if(box)box.classList.toggle('low',s<=300);
  if(dirty&&performance.now()-lastSave>10000){lastSave=performance.now();save();}
  const tl=document.getElementById('tlab');if(tl)tl.textContent=s<=0?'Time is up':'Time left';

}
async function save(p){
  if(MOCK){dirty=false;return;}
  if(saving||sent)return;saving=true;dirty=false;
  const r=await sb.rpc('exam_save',{p_stage:stage,p_answers:answers,p_part:p==null?part:p});
  const sv=document.getElementById('sv');if(sv)sv.textContent=r.error?'Not saved: check your connection':'Saved';
  if(r.error)dirty=true;saving=false;
}
function shell(){
  clear();
  const minus=el('button',{type:'button','aria-label':'Smaller text',id:'fsm'},'A−'),plus=el('button',{type:'button','aria-label':'Larger text',id:'fsp'},'A+'),norm=el('button',{type:'button','aria-label':'Normal text size'},'A');
  function upd(){minus.disabled=Gate.sizeIdx()===0;plus.disabled=Gate.sizeIdx()===Gate.sizeMax();}
  minus.addEventListener('click',()=>{Gate.setSize(Gate.sizeIdx()-1);upd();});plus.addEventListener('click',()=>{Gate.setSize(Gate.sizeIdx()+1);upd();});norm.addEventListener('click',()=>{Gate.setSize(1);upd();});upd();
  app.append(
    el('header',{class:'xh'},el('div',{class:'xh-in'},
      el('div',{class:'brand'},el('img',{src:'img/britland-shield.png',alt:''}),el('span',{class:'hl'},el('b',{},'BRITLAND'),el('i',{},'ACADEMY')),el('div',{},el('b',{},MOCK&&MOCK.teach?'Stage '+stage+(MOCK.exam?' Exam':' Mock '+MOCK.test)+' · answers':(MOCK?'Stage '+stage+' Mock '+MOCK.test:'Stage '+stage+' Exam')),el('small',{id:'sub'},''))),
      el('span',{class:'who'},MOCK&&MOCK.teach?'Teacher view':NAME),el('span',{class:'sv',id:'sv','aria-live':'polite'},'Saved'),
      el('div',{class:'fs',role:'group','aria-label':'Text size'},minus,norm,plus),
      el('div',{class:'timer',id:'tbox',role:'timer','aria-label':'Time left'},el('div',{},el('small',{id:'tlab'},'Time left'),el('b',{id:'tm'},'--:--'))))),
    el('button',{type:'button',class:'endb',id:'endb',hidden:true},'End exam'),

const MOCK_ED=QS.get('ed')==='2nd'?'2nd':'3rd';
function mockFile(n,t){return 'mocks/stage'+String(n).padStart(2,'0')+'-'+MOCK_ED+'-'+t+'.json';}
function mnorm(t){return String(t==null?'':t).replace(/[’‘]/g,"'").toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();}
function wdist(a,b){const n=a.length,m=b.length;if(!n)return m;if(!m)return n;let pv=[];for(let j=0;j<=m;j++)pv.push(j);
  for(let i=1;i<=n;i++){const cu=[i];for(let j=1;j<=m;j++){cu[j]=Math.min(pv[j]+1,cu[j-1]+1,pv[j-1]+(a[i-1]===b[j-1]?0:1));}pv=cu;}return pv[m];}
function okItem(kp,n,ans){
  const a=(ans[kp.id]||{})[n];
  if(kp.id==='yesno'){const v=String(a||'').toLowerCase();return v===''||v==='?'?0:(v===String(kp.keys[n]).toLowerCase()?1:-1);}
  if(kp.id==='oral'||kp.id==='mc')return String(a||'').toLowerCase()===String(kp.keys[n]).toLowerCase()?1:0;
  const x=mnorm(a);return x!==''&&(kp.accept[n]||[]).some(y=>mnorm(y)===x)?1:0;
}
function mgrade(keys,ans){
  const sc={},mx={};
  keys.parts.forEach(kp=>{let s=0;
    if(kp.id==='dictation'){const t=mnorm(ans.dictation);if(t){s=Math.max(0,kp.points-wdist(mnorm(kp.text).split(' '),t.split(' ')));}}
    else{const ns=Object.keys(kp.keys||kp.accept||{});ns.forEach(n=>{s+=okItem(kp,n,ans);});s=Math.max(0,s);}
    sc[kp.id]=s;mx[kp.id]=kp.points;});
  return {scores:sc,maxes:mx};
}

  if(sent)return;sent=true;clearInterval(tick);closeModal();
  const g=mgrade(MOCK.keys,answers),used=Math.round(MOCK.minutes*60-left());
  sb.from('mock_attempts').insert({stage:stage,edition:MOCK_ED,test:MOCK.test,answers:answers,scores:g.scores,maxes:g.maxes,seconds_used:used}).then(()=>{},()=>{});
  mockFinished(g);
}
function mockFinished(g){
  const kids=[logo(),el('h1',{class:'center'},'Stage '+stage+' Mock '+MOCK.test)];
  let T=0,M=0;const kp=el('div',{class:'kp'});
  MOCK.keys.parts.forEach(p=>{T+=g.scores[p.id];M+=g.maxes[p.id];kp.append(el('div',{},el('small',{},PART_NAME[p.id]||p.id),el('b',{},BL_EXAM.fmt(g.scores[p.id])+' / '+p.points)));});
  kids.push(el('p',{class:'center big'},BL_EXAM.fmt(T)+' / '+M+' ('+Math.round(100*T/M)+'%)'),kp,MOCK_ED==='3rd'?el('p',{class:'center'},'Pass mark in the official exam: 30 / 50.'):null);
  MOCK.keys.parts.forEach(kpart=>{
    const ip=items.parts.find(x=>x.id===kpart.id)||{};
    kids.push(el('h2',{style:'margin:18px 0 6px;color:var(--navy)'},ip.title||kpart.id));
    if(kpart.id==='dictation'){kids.push(el('p',{},el('b',{},'Correct text: '),kpart.text),el('p',{},el('b',{},'Your text: '),answers.dictation||'(blank)'));return;}
    const show=(k,v)=>{const o=((ip.items||[]).find(i=>i.n===Number(k))||{}).opts;return o&&o[v]?v.toUpperCase()+') '+o[v]:(v||'—');};
    Object.keys(kpart.keys||kpart.accept).sort((a,b)=>a-b).forEach(n=>{
      const ok=okItem(kpart,n,answers)>0,a=(answers[kpart.id]||{})[n];
      let mine,right;
      if(kpart.id==='oral'||kpart.id==='mc'){mine=a?show(n,a):'—';right=show(n,kpart.keys[n]);}
      else if(kpart.id==='yesno'){mine=a||'—';right=kpart.keys[n];}
      else{mine=a||'—';right=kpart.accept[n][0];}
      const it=(ip.items||[]).find(i=>i.n===Number(n));
      kids.push(el('div',{style:'border-top:1px solid var(--line);padding:6px 0'},
        el('div',{},el('b',{},n+'. '),it&&(it.q||it.text)?String(it.q||it.text):''),
        el('div',{class:ok?'good':'msg-bad'},(ok?'Correct: ':'Your answer: ')+mine),
        ok?null:el('div',{},'Correct answer: ',el('b',{},right))));
    });
  });
  const again=el('a',{class:'btnl',href:'exam.html?mock=1&ed='+MOCK_ED+'&stage='+stage+'&test='+MOCK.test},'Try again'),list=el('a',{class:'btnl',href:'exam.html?mock=1&ed='+MOCK_ED,style:'background:#fff;color:var(--navy);border-color:var(--navy)'},'All mock tests');
  kids.push(el('p',{style:'display:flex;gap:10px;flex-wrap:wrap;margin-top:18px'},again,list,leave()));
  screen([el('div',{class:'scr'},...kids)]);
}
home();
