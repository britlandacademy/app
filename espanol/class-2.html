<script>
Gate.start({kinds:[],bare:true},function(){
  var m=document.getElementById("zm");
  Gate.sb.rpc("get_class_link",{p_slug:"class-2"}).then(function(r){
    if(r.data){m.textContent="";var a=document.createElement("a");a.href=r.data;a.textContent="Toca aquí para entrar";m.append("Si no se abre, ",a,".");location.replace(r.data);}
    else m.textContent="El enlace de la clase no está disponible ahora. Pregunta a tu profesor.";
  },function(){m.textContent="No se pudo cargar el enlace de la clase. Revisa tu conexión e inténtalo de nuevo.";});
});
