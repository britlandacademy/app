<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Verificar un certificado · Britland Academy</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="stylesheet" href="../js/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{background:#F9F9F7;color:#0A192F;font-family:Montserrat,Arial,sans-serif;padding:24px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));min-height:100vh}
.wrap{max-width:460px;margin:0 auto}
.lk{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:20px}.lk img{height:56px;width:auto}
.lk b{display:block;font:700 26px/1 Lora,Georgia,serif;color:#102C50}.lk i{display:block;font:500 14px/1 Montserrat,Arial,sans-serif;letter-spacing:.07em;color:#B11929;margin-top:5px;font-style:normal}
.card{background:#fff;border:1px solid #d9d2c3;border-radius:16px;padding:24px 18px;text-align:center}
.ic{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff}.ic.ok{background:#1d7a3e}.ic.no{background:#9c2a22}.ic.wt{background:#7F6324}
.ic svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
h1{font:700 22px Lora,Georgia,serif}.s{color:#4a5468;font-size:14px;margin:6px 0 14px;line-height:1.5}
.rows{text-align:left;border-top:1px solid #e6dfd0}.r{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eee7d8;font-size:14px}
.r span{color:#7F6324;font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding-top:2px}.r b{text-align:right;font-weight:600;overflow-wrap:anywhere}
form{display:flex;gap:8px;margin-top:16px;text-align:left}
input{flex:1;min-width:0;border:1.5px solid #cfc6b2;border-radius:10px;padding:11px 12px;font:inherit;font-size:16px;background:#fff;color:#0A192F}
button{background:#0F2247;color:#fff;border:0;border-radius:10px;padding:0 18px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.f{text-align:center;color:#6b7386;font-size:12px;margin-top:18px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<div class="lk"><img src="img/britland-shield.png" alt="" width="48" height="56"><div><b>BRITLAND</b><i>ACADEMY</i></div></div>
<div class="card" id="card" aria-live="polite"><div class="ic wt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg></div><h1>Comprobando…</h1></div>
<p class="f">Britland Academy · Franca/SP · CNPJ 44.073.803/0001-41</p>
</div>
<script src="js/config.js"></script>
<script>
(function(){
'use strict';
var TX={"loc": "es", "id": "ID del certificado", "verify": "Verificar", "wait": "Comprobando…", "enter": "Verificar un certificado", "enterS": "Escribe el ID impreso en el certificado.", "student": "Alumno", "course": "Curso", "hours": "Horas académicas", "result": "Resultado", "dist": "Con Distinción", "done": "Finalizado el", "cid": "ID del certificado", "ok": "Certificado verificado", "okS": "Este certificado fue emitido por Britland Academy.", "no": "Certificado no encontrado", "noS": "No encontramos un certificado válido con este ID. Comprueba que lo escribiste bien o contacta con la escuela.", "err": "No se pudo comprobar ahora", "errS": "Inténtalo de nuevo en un momento.","stageOf":function(n){return 'Español · Etapa '+n;}};
var C=window.CALLAN_CFG,card=document.getElementById('card');
var CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',X='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function getId(){var q=new URLSearchParams(location.search).get('id')||location.hash.replace(/^#/,'');return String(q||'').trim().toUpperCase().slice(0,40);}
function form(v){return '<form id="f" autocomplete="off"><input id="i" type="text" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="BA-STG01-2026-0000" value="'+esc(v||'')+'" aria-label="'+esc(TX.id)+'"><button type="submit">'+esc(TX.verify)+'</button></form>';}
function bind(){var f=document.getElementById('f');if(!f)return;f.addEventListener('submit',function(e){e.preventDefault();var v=document.getElementById('i').value.trim().toUpperCase();if(!v)return;history.replaceState(null,'','?id='+encodeURIComponent(v));run();});}
function dmy(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return s||'';return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(TX.loc,{day:'numeric',month:'long',year:'numeric'});}
function show(ok,html,id){card.innerHTML=html;bind();}
async function run(){
  var id=getId();
  if(!id){card.innerHTML='<div class="ic wt">'+X.replace('M6 6l12 12M18 6L6 18','M12 7v6M12 17h.01')+'</div><h1>'+esc(TX.enter)+'</h1><p class="s">'+esc(TX.enterS)+'</p>'+form('');bind();return;}
  card.innerHTML='<div class="ic wt"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg></div><h1>'+esc(TX.wait)+'</h1>';
  try{
    var r=await fetch(C.url+'/rest/v1/rpc/cert_verify',{method:'POST',headers:{'apikey':C.key,'Authorization':'Bearer '+C.key,'Content-Type':'application/json'},body:JSON.stringify({p_id:id})});
    if(!r.ok)throw new Error(r.status);
    var d=await r.json();
    if(d&&d.valid){
      var rows=[[TX.student,d.name],[TX.course,TX.stageOf(d.stage)],[TX.hours,d.hours+' h'],d.distinction?[TX.result,TX.dist]:null,[TX.done,dmy(d.completed_on)],[TX.cid,id]].filter(Boolean);
      card.innerHTML='<div class="ic ok">'+CHK+'</div><h1>'+esc(TX.ok)+'</h1><p class="s">'+esc(TX.okS)+'</p><div class="rows">'+rows.map(function(x){return '<div class="r"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';}).join('')+'</div>'+form('');bind();
    }else{
      card.innerHTML='<div class="ic no">'+X+'</div><h1>'+esc(TX.no)+'</h1><p class="s">'+esc(TX.noS)+'</p>'+form(id);bind();
    }
  }catch(e){card.innerHTML='<div class="ic no">'+X+'</div><h1>'+esc(TX.err)+'</h1><p class="s">'+esc(TX.errS)+'</p>'+form(id);bind();}
}
run();
})();
</script>
</body></html>
