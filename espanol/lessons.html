/* Callan book identity: FreeSet, black and grey, black band with the logo, grey blocks for titles */
:root{
  --bg:#ffffff; --card:#ececec; --surface:#ffffff; --ink:#111111; --muted:#4d4d4d; --line:#b8b8b8;
  --accent:#111111; --accent-ink:#ffffff; --chip:#d9d9d9; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#1d5e2e; --ok-bg:#e3efe5; --bad:#9c2a22; --bad-bg:#f6e4e2; --warn:#6b4a00; --warn-bg:#f3ead0;
  --font-display:'FreeSet','Helvetica Neue',Arial,sans-serif;
  --font-body:'FreeSet','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --card:#242424; --surface:#1a1a1a; --ink:#f2f2f2; --muted:#b5b5b5; --line:#4a4a4a;
  --accent:#f2f2f2; --accent-ink:#111111; --chip:#333333; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#7fd29a; --ok-bg:#183222; --bad:#ff9e94; --bad-bg:#3a1f1d; --warn:#f0c36a; --warn-bg:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --card:#242424; --surface:#1a1a1a; --ink:#f2f2f2; --muted:#b5b5b5; --line:#4a4a4a;
  --accent:#f2f2f2; --accent-ink:#111111; --chip:#333333; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#7fd29a; --ok-bg:#183222; --bad:#ff9e94; --bad-bg:#3a1f1d; --warn:#f0c36a; --warn-bg:#3a2e12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto}
header{padding:8px 0 20px}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.15;margin:0 0 10px;text-wrap:balance}
.intro{max-width:68ch;margin:0;color:var(--ink)}
.rule{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:var(--surface);max-width:68ch}
.rule b{font-weight:700}
.eg{display:block;margin-top:4px;font-family:var(--font-display);font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px 18px 20px;min-width:0}
.card h2{font-family:var(--font-display);font-size:1.25rem;margin:0 0 4px;text-wrap:balance}
.card .lab{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.instr{margin:0 0 12px;color:var(--muted)}
.facts{margin:0 0 14px;padding:10px 12px;background:var(--chip);border-radius:3px;font-size:.97rem}
.facts b{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.item{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;padding:10px 10px 12px;border:1px solid var(--line);border-radius:3px}
.item .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.item.ok{border-color:var(--ok);background:var(--ok-bg)}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
.q{margin:0 0 6px;font-weight:700;font-family:var(--font-display);font-size:1.05rem}
.sit{margin:0 0 6px;font-size:.95rem;color:var(--muted)}
.shown{margin:0 0 8px;font-size:1rem}
.shown s{text-decoration-thickness:2px}
.pic{display:inline-block;font-size:2rem;line-height:1;margin:0 0 6px}
.swatch{display:inline-block;width:44px;height:28px;border-radius:2px;border:2px solid var(--ink);vertical-align:middle;margin:0 0 6px}
.big{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1;margin:0 0 6px}
.ctx{display:block}
input.txt,select{width:100%;min-height:46px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px}
input.txt.inl{width:9em;display:inline-block;margin:2px 4px}
input.txt:disabled,select:disabled{opacity:1;background:transparent}
.cloze{margin:0;font-size:1.05rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 10px;margin:6px 0 0;border:2px solid var(--line);border-radius:3px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--chip)}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.tf{display:flex;gap:8px;flex-wrap:wrap}
.tf .opt{flex:1 1 130px;margin:0}
.area{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:2px dashed var(--line);border-radius:3px;margin:0 0 8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{min-height:44px;min-width:44px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--chip);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.area .chip{background:var(--surface);border-color:var(--accent)}
.chip:disabled{cursor:default}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button.btn{min-height:46px;padding:10px 20px;font:inherit;font-weight:700;border-radius:3px;border:2px solid var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}

<script>
Gate.start({kinds:['text'],noStageBox:true},function(ctx){
if(window.Protect)Protect.on((ctx.profile&&ctx.profile.name||'')+' · '+(ctx.user&&ctx.user.email||''));
'use strict';
function el(tag,props){const e=document.createElement(tag);for(const k in (props||{})){const v=props[k];if(v===null||v===undefined||v===false)continue;if(k==='class')e.className=v;else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v);}
  for(let i=2;i<arguments.length;i++){const c=arguments[i];if(c===null||c===undefined)continue;Array.isArray(c)?c.forEach(x=>e.append(x)):e.append(c);}return e;}
const UPTO=Math.max(1,Math.min(112,parseInt(window.LESSONS_UPTO,10)||1));
const ALL=[{n:1,from:1,to:16},{n:2,from:17,to:32},{n:3,from:33,to:52},{n:4,from:53,to:72},{n:5,from:73,to:92},{n:6,from:93,to:112}];
const STAGES=ALL.filter(t=>t.from<=UPTO).map(t=>({n:t.n,from:t.from,to:Math.min(t.to,UPTO)}));
const DICT={};
function stageOf(id){return STAGES.find(t=>id>=t.from&&id<=t.to)||STAGES[0];}
function player(label,path,lazy){
  const a=el('audio',{controls:true,preload:'none','aria-label':label});
  const note=el('p',{class:'hint','aria-live':'polite'});
  const spd=el('div',{class:'spd',role:'group','aria-label':'Playback speed'});
  const btns=[0.75,1,1.25].map(v=>{const b=el('button',{type:'button','aria-pressed':v===1?'true':'false',onclick:()=>{a.playbackRate=v;btns.forEach(x=>x.b.setAttribute('aria-pressed',x.v===v?'true':'false'));}},v+'×');return {v:v,b:b};});
  btns.forEach(x=>spd.append(x.b));
  let retried=false,loaded=false;
  function load(){
    loaded=true;
    return Gate.audioUrl(path).then(u=>{a.src=u;},()=>{note.textContent='Este audio todavía no está disponible.';});
  }
  a.addEventListener('error',()=>{
    if(!a.getAttribute('src'))return;
    if(!retried){retried=true;load();}else note.textContent='Este audio todavía no está disponible.';
  });
  a.addEventListener('playing',()=>{note.textContent='';retried=false;});
  const sec=el('section',{class:'audio ap'},el('p',{class:'lab'},label),a,spd,note);
  sec.load=()=>{if(!loaded)load();};
  if(!lazy)load();
  return sec;
}
function renderText(id,box){
  const data=(window.LESSON_TEXT||{})[id];
  if(!data){box.append(el('p',{class:'missing'},'El texto de esta lección todavía no está disponible.'));return;}
  const n=stageOf(id).n,base='Etapa '+n+'/';
  data.forEach(b=>{
    const k=b[0];
    if(k==='v')box.append(el('div',{class:'vrow'},b[1].map(c=>el('span',{},c))));
    else if(k==='qa'){box.append(el('div',{class:'qa'},el('p',{class:'qq'},b[1]),b[2]?el('p',{class:'qa-a'},b[2]):null));}
    else if(k==='s')box.append(el('p',{class:'say'},b[1]));
    else if(k==='c')box.append(el('p',{class:'chartnote'},'Ver Gráfico '+b[1]));
    else if(k==='d'){
      const dp=player('Dictado '+b[1],base+'Dictados/Etapa '+n+' Dictado '+b[1]+'.mp3',true);
      const det=el('details',{class:'dict'},el('summary',{},'Dictado '+b[1]+' (mostrar el texto)'),el('p',{class:'dtext'},b[2]),dp);
      det.addEventListener('toggle',()=>{if(det.open)dp.load();});
      box.append(det);
    }
  });
}
const stSel=document.getElementById('st'),lsSel=document.getElementById('ls'),out=document.getElementById('out'),ttl=document.getElementById('ttl');
const prevs=[document.getElementById('prev'),document.getElementById('prev2')],nexts=[document.getElementById('next'),document.getElementById('next2')];
const CS=window.CALLAN_STAGE||1,CT=STAGES.find(t=>t.n===CS)||STAGES[0],LO=CT.from,HI=Math.min(CT.to,UPTO);
STAGES.filter(t=>t.n===CT.n).forEach(t=>stSel.append(el('option',{value:String(t.n)},'Etapa '+t.n)));
/* ---- covers: big cover of this Stage + strip of all 12 ---- */
(function(){
  const img=document.getElementById('cvbig'),strip=document.getElementById('cvstrip');
  img.src='img/covers/es-'+CT.n+'.png';img.alt='Libro del Alumno · Etapa '+CT.n;img.height=Math.round(150*1.42);
  const full=ALL.find(t=>t.n===CT.n);
  ALL.forEach(t=>{
    const open=t.from<=UPTO;
    const b=el('button',{type:'button','aria-label':'Etapa '+t.n+(open?'':' (bloqueada)'),title:'Etapa '+t.n,disabled:!open,'aria-current':t.n===CT.n?'true':null,onclick:()=>{
      if(t.n===CT.n)return;
      document.body.classList.add('fadeout');
      setTimeout(()=>{try{localStorage.setItem('callan-stage-es',String(t.n));}catch(e){}
        try{const u=new URL(location.href);u.searchParams.delete('stage');location.href=u.toString();}catch(e){location.reload();}},230);
    }},el('img',{src:'img/covers/es-'+t.n+'.png',alt:'',width:'60',height:'85'}));
    strip.append(b);
  });
  img.style.opacity='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{img.style.opacity='';}));
})();
let cur=LO;
try{const v=parseInt(localStorage.getItem('callan-lesson-last-es'),10);if(v>=LO&&v<=HI)cur=v;}catch(e){}
function fillLessons(n){
  const t=STAGES.find(x=>x.n===n);lsSel.textContent='';
  for(let i=t.from;i<=Math.min(t.to,UPTO);i++)lsSel.append(el('option',{value:String(i)},'Lección '+i));
}
function show(id,noscroll){
  cur=id;const t=stageOf(id),n=t.n;
  stSel.value=String(n);fillLessons(n);lsSel.value=String(id);
  ttl.textContent='Lección '+id;
  out.textContent='';
  const box=el('div',{class:'lesson'});
  box.append(player('Escucha la Lección '+id,'Etapa '+n+'/Etapa '+n+' Lección '+String(id).padStart(3,'0')+'.mp3'));
  renderText(id,box);
  out.append(box);
  prevs.forEach(b=>{b.disabled=id<=LO;});nexts.forEach(b=>{b.disabled=id>=HI;});
  try{localStorage.setItem('callan-lesson-last-es',String(id));}catch(e){}
  if(!noscroll)window.scrollTo({top:0});
}
stSel.addEventListener('change',()=>show(STAGES.find(t=>t.n===+stSel.value).from));
lsSel.addEventListener('change',()=>show(+lsSel.value));
prevs.forEach(b=>b.addEventListener('click',()=>{if(cur>LO)show(cur-1);}));
nexts.forEach(b=>b.addEventListener('click',()=>{if(cur<HI)show(cur+1);}));
show(cur,true);
});
</script>
</body></html>
