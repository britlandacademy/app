<!doctype html>
<meta charset="utf-8">
<title>Gramática · Britland Academy</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="../js/pwa.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
/* Callan book identity: FreeSet, black and grey, black band with the logo, grey blocks for titles */
:root{
  --bg:#ffffff; --card:#ececec; --surface:#ffffff; --ink:#111111; --muted:#4d4d4d; --line:#b8b8b8;
  --accent:#111111; --accent-ink:#ffffff; --chip:#d9d9d9; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#1d5e2e; --ok-bg:#e3efe5; --bad:#9c2a22; --bad-bg:#f6e4e2; --warn:#6b4a00; --warn-bg:#f3ead0;
  --font-display:'FreeSet','Helvetica Neue',Arial,sans-serif;
  --font-body:'FreeSet','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --card:#242424; --surface:#1a1a1a; --ink:#f2f2f2; --muted:#b5b5b5; --line:#4a4a4a;
  --accent:#f2f2f2; --accent-ink:#111111; --chip:#333333; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#7fd29a; --ok-bg:#183222; --bad:#ff9e94; --bad-bg:#3a1f1d; --warn:#f0c36a; --warn-bg:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --card:#242424; --surface:#1a1a1a; --ink:#f2f2f2; --muted:#b5b5b5; --line:#4a4a4a;
  --accent:#f2f2f2; --accent-ink:#111111; --chip:#333333; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#7fd29a; --ok-bg:#183222; --bad:#ff9e94; --bad-bg:#3a1f1d; --warn:#f0c36a; --warn-bg:#3a2e12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto}
header{padding:8px 0 20px}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.15;margin:0 0 10px;text-wrap:balance}
.intro{max-width:68ch;margin:0;color:var(--ink)}
.rule{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:var(--surface);max-width:68ch}
.rule b{font-weight:700}
.eg{display:block;margin-top:4px;font-family:var(--font-display);font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px 18px 20px;min-width:0}
.card h2{font-family:var(--font-display);font-size:1.25rem;margin:0 0 4px;text-wrap:balance}
.card .lab{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.instr{margin:0 0 12px;color:var(--muted)}
.facts{margin:0 0 14px;padding:10px 12px;background:var(--chip);border-radius:3px;font-size:.97rem}
.facts b{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.item{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;padding:10px 10px 12px;border:1px solid var(--line);border-radius:3px}
.item .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.item.ok{border-color:var(--ok);background:var(--ok-bg)}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
.q{margin:0 0 6px;font-weight:700;font-family:var(--font-display);font-size:1.05rem}
.sit{margin:0 0 6px;font-size:.95rem;color:var(--muted)}
.shown{margin:0 0 8px;font-size:1rem}
.shown s{text-decoration-thickness:2px}
.pic{display:inline-block;font-size:2rem;line-height:1;margin:0 0 6px}
.swatch{display:inline-block;width:44px;height:28px;border-radius:2px;border:2px solid var(--ink);vertical-align:middle;margin:0 0 6px}
.big{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1;margin:0 0 6px}
.ctx{display:block}
input.txt,select{width:100%;min-height:46px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px}
input.txt.inl{width:9em;display:inline-block;margin:2px 4px}
input.txt.inl.wd{width:14em;max-width:100%}
input.txt.inl.md{width:8.5em;max-width:100%}
li.item .imgwide input.txt{display:block;width:100%;margin:4px 0;font-size:.94em;padding-left:12px;padding-right:8px}
ol.items.grid.long{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
ol.items.grid.long .gimg2{max-height:170px;object-fit:contain}
select.inl{width:auto;min-width:9em;max-width:100%;display:inline-block;margin:2px 4px}
input.txt:disabled,select:disabled{opacity:1;background:transparent}
.cloze{margin:0;font-size:1.05rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 10px;margin:6px 0 0;border:2px solid var(--line);border-radius:3px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--chip)}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.tf{display:flex;gap:8px;flex-wrap:wrap}
.tf .opt{flex:1 1 130px;margin:0}
.area{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:2px dashed var(--line);border-radius:3px;margin:0 0 8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{min-height:44px;min-width:44px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--chip);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.area .chip{background:var(--surface);border-color:var(--accent)}
.chip:disabled{cursor:default}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button.btn{min-height:46px;padding:10px 20px;font:inherit;font-weight:700;border-radius:3px;border:2px solid var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.small{min-height:44px;padding:6px 14px;font:inherit;font-size:.95rem;background:transparent;color:var(--accent);border:2px solid var(--line);border-radius:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{grid-column:2;margin-top:6px;font-size:.97rem}
.fb[hidden]{display:none}
.mark{font-weight:700}
.ok .mark{color:var(--ok)} .bad .mark{color:var(--bad)}
.fb .warn{margin:4px 0 0;padding:6px 10px;background:var(--warn-bg);color:var(--warn);border-radius:2px}
.fb .msg{margin:4px 0 0}
.why{margin:8px 0 0}.why-btn{font-weight:600}.why-txt{margin:6px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--surface);border-radius:6px}
.fb .model{margin:4px 0 0}
.fb .model b{font-family:var(--font-display)}
.score{margin:12px 0 0;font-weight:700;min-height:1.5em}
.total{grid-column:1/-1}
.bar{height:16px;border-radius:99px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin:10px 0}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .4s}
.big-score{font-family:var(--font-display);font-size:1.6rem;font-weight:700;margin:0}
.msgtotal{margin:6px 0 0}
footer{margin-top:24px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar>div{transition:none}}
@media (max-width:400px){.card{padding:14px 12px 16px}.item{grid-template-columns:1.6rem minmax(0,1fr);padding:8px}}
.panel{min-width:0}
.sub{margin:0 0 14px;color:var(--muted);max-width:68ch}
.panel>.card.total{margin-top:18px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.tab{min-height:46px;padding:8px 16px;font:inherit;font-weight:700;color:var(--accent);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.tab.on{border-color:var(--accent);background:var(--chip)}
.tab:disabled{color:var(--muted);cursor:not-allowed;opacity:.8}
.tstat{font-weight:400;font-size:.88rem;color:var(--muted);margin-left:4px}
.locknote{margin:0 0 14px;padding:8px 12px;border-radius:3px;background:var(--warn-bg);color:var(--warn)}
.warnbox{margin:12px 0 0;padding:8px 12px;border-radius:3px;background:var(--warn-bg);color:var(--warn);max-width:68ch}
.welcome{max-width:520px}
.err{margin:6px 0 0;color:var(--bad);min-height:1.2em}
.card.done{display:flex;flex-direction:column}
.ok-line{margin:0 0 4px;color:var(--ok);font-weight:700}
.hsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:0 0 16px}
.hbox{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--surface)}
.hbox .big-score{margin:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:380px;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
caption{padding:8px 10px;text-align:left}
textarea.rep{width:100%;margin-top:12px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:8px 12px}
a.btn{display:inline-flex;align-items:center;min-height:46px;padding:10px 20px;font-weight:700;border-radius:3px;border:2px solid var(--accent);text-decoration:none;color:var(--accent)}
button.btn.danger{border-color:var(--bad);color:var(--bad)}
.tagline{margin:0 0 4px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.band{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;background:var(--band);color:var(--band-ink);padding:22px 20px;border:1px solid var(--line)}
.band .logo{width:150px;height:auto;flex:none;color:#fff}
.band .eyebrow{color:var(--band-muted);margin:0 0 4px}
.band h1{color:#fff;margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.band .intro{color:var(--band-muted)}
.band>div{min-width:0;flex:1 1 260px}
h2.sep{background:var(--chip);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:clamp(1.3rem,4.6vw,1.9rem);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;padding:14px 16px}
.card{background:var(--card);border:0}
.item,input.txt,select,.opt,.chip,.hbox,.tblwrap,textarea.rep,.rule{background:var(--surface)}
.facts{background:var(--chip)}
button.primary{background:var(--accent);color:var(--accent-ink)}
.tab{color:var(--ink);background:var(--surface)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.on .tstat{color:var(--accent-ink)}
.opt:has(input:checked){background:var(--chip)}
.area .chip{background:var(--chip)}
.band .teacher{margin:10px 0 0;color:#fff;font-weight:700;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip2{min-width:48px;min-height:46px;padding:6px 10px;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip2 small{font-weight:400;font-size:.72rem;color:var(--muted)}
.chip2.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip2.on small{color:var(--accent-ink)}
.chip2.done{border-color:var(--ok)}
.chip2:disabled{color:var(--muted);cursor:not-allowed;opacity:.75}
.audio{margin:0 0 16px;padding:12px 14px;background:var(--card);border-radius:3px}
.audio audio{width:100%;display:block;margin:6px 0 8px}
.audio .spd{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.audio .spd button{min-height:44px;min-width:56px;padding:4px 10px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.audio .spd button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.audio .lab{margin:0}
.audio .ap+.ap{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rwtxt{margin-top:8px}
.rwtxt label{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
.rwtxt input.txt{width:12em;max-width:100%}

.passage{margin:0 0 14px;padding:12px 14px;background:var(--chip);border-left:4px solid var(--accent);border-radius:3px;line-height:1.55;font-size:1rem}
.listen{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 8px}
.listen .lb{min-height:44px;padding:4px 14px;font:inherit;font-weight:700;color:var(--accent-ink);background:var(--accent);border:2px solid var(--accent);border-radius:3px;cursor:pointer}
.listen select{min-height:44px;font:inherit}
.trans{margin:6px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--surface);border-radius:6px;font-style:italic}
.wr textarea{width:100%;min-height:190px;font:inherit;font-size:1rem;line-height:1.5;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:10px 12px;resize:vertical}
.wr .cnt{margin:4px 0 10px;color:var(--muted);font-size:.9rem}
.wr .prompt{margin:0 0 10px;font-weight:600}
.wr .modelbox{margin:12px 0;padding:12px 14px;background:var(--chip);border-radius:3px;line-height:1.55}
.wr .crit{list-style:none;margin:8px 0 12px;padding:0}
.wr .crit li{margin:0 0 6px}
.wr .crit label{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:8px 10px;background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.lvhead{margin:0 0 6px;color:var(--muted)}

/* ---- Gramática: teoría + ejercicios ---- */
.gtop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 10px}
.gtop label{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:8px}
.gtop select{width:auto;min-width:12em;max-width:100%}
.mtabs{display:flex;gap:8px;margin:6px 0 10px}
.layout{display:block}
.gtheory,.gwork{min-width:0}
.gtheory .tcard{margin:0 0 12px}
.gtheory h3.th{margin:14px 0 6px;font-family:var(--font-display);font-size:1.05rem}
.gtheory p{margin:6px 0}
.gimg{max-width:100%;height:auto;display:block;margin:8px 0;border-radius:3px;background:#fff}
.geg{margin:4px 0 4px 10px;font-family:var(--font-display)}
.gnote{border-left:4px solid var(--accent);padding:8px 12px;background:var(--chip);border-radius:3px;margin:10px 0}
.gcols{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0}
.gbox{border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.gbox h4{margin:0;padding:6px 10px;background:var(--chip);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gbox p{margin:0;padding:6px 10px}
.gplus{font-size:1.5rem;font-weight:700;color:var(--muted)}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.gq{display:block;font-weight:400;margin:0 0 6px}
input.txt.bl{width:4.8em}
.bank{margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--chip);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:1.02rem}
.bank s{color:var(--muted)}
form.card>.tblwrap table{min-width:0;width:100%}form.card>.tblwrap td,form.card>.tblwrap th{padding:6px 4px!important;font-size:.85em;white-space:normal}
.exfig{display:block;max-width:100%;height:auto;margin:0 auto 12px;background:#fff;border-radius:6px}
ol.items.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:0;list-style:none}
ol.items.grid>li.item{display:flex;flex-direction:column;gap:6px;min-width:0}
.gimg2{display:block;width:100%;height:auto;background:#fff;border-radius:6px}
li.item .imgin{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:6px}
li.item .imgin input.txt{width:100%;min-width:0}
.sortrow{display:flex;align-items:center;gap:8px}.sortrow b{flex:1;font-size:1.05rem}
.opt2{min-width:56px;min-height:44px;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.opt2[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt2:disabled{cursor:default}
.listnote{margin:8px 0 0;color:var(--muted)}
.ctx{margin:0 0 4px;color:var(--muted)}
input.txt.okb{border-color:var(--ok)}input.txt.badb{border-color:var(--bad)}
select.pk{width:auto;min-height:40px;margin:2px 4px;padding:4px 8px}
.pair{display:inline-block;white-space:nowrap}
.gmeta{margin:2px 0 12px;color:var(--muted);font-size:.95rem}
@media (max-width:899px){.gcols{grid-template-columns:1fr}.gplus{text-align:center}.gtop>div{width:100%}.gtop select{width:100%;margin-top:4px}}
@media (min-width:900px){
  .mtabs{display:none}
  .layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
  .gtheory{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
  .gtheory[hidden],.gwork[hidden]{display:block}
}
</style>

Gate.start({kinds:[],attempts:'ex'},function(ctx){
if(window.Protect)Protect.on((ctx.profile&&ctx.profile.name||'')+' · '+(ctx.user&&ctx.user.email||''),{wm:false});
const UNITS=window.GRAM||[];
/* ---------- utilidades ---------- */
function el(tag,props){
  const e=document.createElement(tag);
  for(const k in (props||{})){const v=props[k];
    if(k==='class')e.className=v; else if(k==='text')e.textContent=v; else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,''); else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(let i=2;i<arguments.length;i++){const c=arguments[i];
    (Array.isArray(c)?c:[c]).forEach(x=>{if(x==null)return;e.append(x.nodeType?x:document.createTextNode(x));});}
  return e;
}
/* el corrector del español acepta letras acentuadas (a diferencia del app en inglés) */
function norm(s){return String(s).toLowerCase().replace(/[‘’`´]/g,"'").replace(/[^a-z0-9áéíóúüñø\s]/g,' ').replace(/\s+/g,' ').trim();}
/* ---------- estado ---------- */
const store={name:ctx.profile.name||ctx.user.email,attempts:ctx.attempts.filter(a=>/^gram:/.test(String(a.e)))};
function best(exId){let b;store.attempts.forEach(a=>{if(a.e===exId&&(b===undefined||a.s>b))b=a.s;});return b;}
function exTotal(e){return e.items.reduce((n,it)=>n+(it.perBlank?it.blanks:1),0);}
function unitStats(U){let pts=0,tot=0,done=0;U.ex.forEach(e=>{tot+=exTotal(e);const b=best(e.id);if(b!==undefined){pts+=b;done++;}});return {pts:pts,tot:tot,done:done,n:U.ex.length};}
let curU=UNITS[0],curEx=0,curTab='e';
const $=id=>document.getElementById(id);
/* ---------- teoría ---------- */
function blockNode(b){
  switch(b.k){
    case 'img':return el('img',{class:'gimg',src:b.src,alt:b.alt,loading:'lazy'});
    case 'h':return el('h3',{class:'th',html:b.t});
    case 'p':return el('p',{html:b.t});
    case 'eg':return el('p',{class:'geg',html:b.t});
    case 'note':return el('div',{class:'gnote'},el('b',{},(b.h||'ATENCIÓN')+':'),b.rows.map(r=>el('div',{html:r})));
    case 'cols':return el('div',{class:'gcols'},
      el('div',{class:'gbox'},el('h4',{},b.l.h),el('p',{html:b.l.rows.join('<br>')})),
      el('div',{class:'gplus','aria-hidden':'true'},b.mid||'+'),
      el('div',{class:'gbox'},el('h4',{},b.r.h),el('p',{html:b.r.rows.join('<br>')})));
    case 'table':return el('div',{class:'tblwrap'},el('table',{},
      b.head?el('thead',{},el('tr',{},b.head.map(h=>el('th',{scope:'col'},h)))):null,
      el('tbody',{},b.rows.map(r=>el('tr',{},r.map(c=>el('td',{html:c})))))));
  }
  return null;
}
function renderTheory(U){
  const box=$('gtheory');box.textContent='';
  box.append(el('section',{class:'card tcard'},el('p',{class:'lab'},'Teoría · Unidad '+U.id),el('h2',{},U.motto||U.name),U.theory.map(blockNode)));
}
/* ---------- ejercicios ---------- */
function buildSort(it,opts){
  const row=el('div',{class:'sortrow'},el('b',{},it.w)),btns=opts.map(o=>el('button',{type:'button',class:'opt2','aria-pressed':'false','aria-label':it.w+': '+o},o));
  let val=it.example?it.ans[0]:'';
  function paint(){btns.forEach((b,i)=>b.setAttribute('aria-pressed',String(opts[i]===val)));}
  btns.forEach((b,i)=>b.addEventListener('click',()=>{val=opts[i];paint();}));
  btns.forEach(b=>row.append(b));paint();
  if(it.example)btns.forEach(b=>{b.disabled=true;});
  const model=()=>it.ans.join(' / ');
  return {nodes:[row],example:!!it.example,
    get:()=>{if(it.example)return {ok:true,model:model()};
      if(!val)return {ok:false,msg:'Sin respuesta.',model:model()};
      const ok=it.ans.some(a=>norm(a)===norm(val));return {ok:ok,msg:ok?'':'Revisa la respuesta modelo.',model:model()};},
    lock:()=>btns.forEach(b=>{b.disabled=true;})};
}
function buildPick(it){
  const parts=it.tpl.split(/\[([^\]]+)\]/),p=el('p',{class:'cloze'}),sels=[];
  parts.forEach((t,i)=>{
    if(i%2===0){p.append(t);return;}
    const sl=el('select',{class:'pk','aria-label':'Opción '+(sels.length+1)},el('option',{value:''},'…'));
    t.split('|').forEach(o=>sl.append(el('option',{value:o},o)));sels.push(sl);p.append(sl);
  });
  if(it.example)sels.forEach((sl,i)=>{sl.value=[].concat(it.ans[i])[0];sl.disabled=true;});
  const model=()=>it.ans.map(x=>Array.isArray(x)?x[0]:x).join('; ');
  return {nodes:[p],example:!!it.example,
    get:()=>{if(it.example)return {ok:true,model:model()};
      if(sels.some(sl=>!sl.value))return {ok:false,msg:'Sin respuesta.',model:model()};
      const ok=sels.every((sl,i)=>(Array.isArray(it.ans[i])?it.ans[i]:[it.ans[i]]).some(a=>norm(sl.value)===norm(a)));return {ok:ok,msg:ok?'':'Revisa la respuesta modelo.',model:model()};},
    lock:()=>sels.forEach(sl=>{sl.disabled=true;})};
}
function buildItem(it,id,ex){
  if(ex&&ex.type==='sort')return buildSort(it,ex.opts||['el','la']);
  if(ex&&ex.type==='pick')return buildPick(it);
  const inputs=[],A={type:'text',autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false',enterkeyhint:'done'};
  let nodes;
  if(it.tpl){
    const parts=it.tpl.split('___'),p=el('p',{class:'cloze'});
    let pair=null;
    parts.forEach((t,i)=>{
      if(pair&&t.trim()===''&&i<parts.length-1){pair.append(' ');}   /* cajas seguidas (___ ___) quedan juntas en la misma línea */
      else{pair=null;if(!((it.full||(it.img&&it.wide))&&i===parts.length-1&&t.trim()==='.'))p.append(t);}
      if(i<parts.length-1){
        const inp=el('input',Object.assign({class:it.wide?'txt inl wd':(it.mid?'txt inl md':'txt inl bl'),'aria-label':'Palabra '+(i+1)},A));inputs.push(inp);
        if(!pair&&!it.full&&parts[i+1]!==undefined&&parts[i+1].trim()===''&&i+1<parts.length-1){pair=el('span',{class:'pair'});p.append(pair);}
        (pair||p).append(inp);
      }
    });
    nodes=[p];
    if(it.img)p.className=it.wide?'cloze imgwide':'cloze imgin';
    if(it.full)p.className='cloze imgwide';
  }else{
    const inp=el('input',Object.assign({id:id,class:'txt'},A));inputs.push(inp);
    nodes=it.q?[el('label',{class:'gq',for:id},it.q),inp]:[inp];
  }
  if(it.ctx)nodes.unshift(el('p',{class:'ctx',html:it.ctx}));
  if(it.img)nodes.unshift(el('img',{class:'gimg2',src:it.img,alt:it.alt||'Ilustración',loading:'lazy'}));
  if(it.example){
    const w=it.exv||it.ans[0].split(' ');
    inputs.forEach((inp,i)=>{inp.value=(it.tpl&&inputs.length>1)?(w[i]||''):it.ans[0];inp.disabled=true;});
  }
  const exN=it.exN||0;
  if(exN){const w=it.ans[0].split(' ');inputs.forEach((inp,i)=>{if(i<exN){inp.value=w[i]||'';inp.disabled=true;}});}
  function model(){return it.ans.join(' / ');}   /* sólo la respuesta del gabarito (con variantes separadas por /) */
  return {nodes:nodes,example:!!it.example,
    value:()=>inputs.map(i=>i.value.trim()).join(' ').trim(),
    get:()=>{
      if(it.perBlank){
        const w=it.ans[0].split(' ');let pts=0;
        inputs.forEach((inp,i)=>{const ok=norm(inp.value)===norm(w[i]||'');inp.classList.toggle('okb',ok);inp.classList.toggle('badb',!ok);if(ok)pts++;});
        return {ok:pts===inputs.length,pts:pts,msg:pts===inputs.length?'':'Revisa las casillas marcadas en rojo.',model:w.join(' · ')};
      }
      const v=inputs.map(i=>i.value.trim()).join(' ').trim();
      if(it.example)return {ok:true,model:model()};
      if(!v)return {ok:false,msg:'Sin respuesta.',model:model()};
      const n=norm(v),ok=it.ans.some(a=>norm(a)===n);
      return {ok:ok,msg:ok?'':'Revisa la respuesta modelo.',model:model()};
    },
    lock:()=>inputs.forEach(i=>{i.disabled=true;})};
}
/* lista libre: cada caja puede ser cualquiera de las respuestas, sin repetir */
function listMatch(ex,built){
  const ents=ex.items.map(it=>it.ans.map(norm)),used=new Array(ents.length).fill(false),res=[];
  built.forEach((o,k)=>{
    const raw=o.b.get(),v=o.b.value?o.b.value():'';
    if(ex.items[k].example){used[k]=true;res[k]={ok:true,model:''};}
  });
  built.forEach((o,k)=>{
    if(ex.items[k].example)return;
    const v=norm(o.b.value());let hit=-1;
    if(v)ents.forEach((a,j)=>{if(hit<0&&!used[j]&&a.includes(v))hit=j;});
    if(hit>=0){used[hit]=true;res[k]={ok:true,model:''};}else res[k]={ok:false,msg:v?'Esta respuesta no está o ya la has escrito.':'Sin respuesta.',model:''};
  });
  const left=ex.items.filter((it,j)=>!used[j]).map(it=>it.ans[0]);
  return {res:res,left:left};
}
function saveAtt(U,ex,right,total,scoreEl){
  scoreEl.textContent='Puntuación: '+right+' de '+total+' · guardando…';
  const att={l:U.id,e:ex.id,s:right,t:total,at:Date.now()};
  store.attempts.push(att);
  Gate.saveAttempt('ex',att).then(()=>{scoreEl.textContent='Puntuación: '+right+' de '+total+' · guardada';$('warn').hidden=true;},
    ()=>{scoreEl.textContent='Puntuación: '+right+' de '+total+' · NO guardada';$('warn').hidden=false;});
  renderChips();renderMeta();
}
function buildEx(U,ex){
  const form=el('form',{class:'card',id:ex.id.replace(/[^a-zA-Z0-9]/g,''),'aria-labelledby':'exh',novalidate:true});
  form.append(el('p',{class:'lab'},'Ejercicio '+ex.lab),el('h2',{id:'exh'},ex.instr));
  if(ex.img)form.append(el('img',{class:'exfig',src:ex.img,alt:ex.alt||'Ilustración',loading:'lazy'}));
  if(ex.tbl)form.append(blockNode(Object.assign({k:'table'},ex.tbl)));
  if(ex.bank){const bk=el('p',{class:'bank'});ex.bank.forEach(w=>{bk.append(w.charAt(0)==='~'?el('s',{},w.slice(1)):el('span',{},w));});form.append(bk);}
  const list=el('ol',{class:'items'+(ex.items.some(x=>x.img)?' grid':'')+(ex.long?' long':'')});
  const built=ex.items.map((it,i)=>{
    const b=buildItem(it,'gi'+(i+1),ex);
    const fb=el('div',{class:'fb',hidden:true,'aria-live':'polite'});
    const li=el('li',{class:'item'},el('span',{class:'n'},String(i+1)),el('div',{},b.nodes),fb);
    if(b.example){li.classList.add('ok');fb.hidden=false;fb.append(el('span',{class:'mark'},'Ejemplo'));}
    list.append(li);return {li:li,fb:fb,b:b};
  });
  form.append(list);
  const score=el('p',{class:'score','aria-live':'polite'});
  const verify=el('button',{type:'submit',class:'btn primary'},'Comprobar');
  const retry=el('button',{type:'button',class:'btn ghost',onclick:()=>renderEx(true)},'Intentar de nuevo');
  form.append(el('div',{class:'btnrow'},verify,retry),score);
  form.addEventListener('submit',e=>{
    e.preventDefault();if(verify.disabled)return;
    let right=0;
    const free=ex.type==='list'?listMatch(ex,built):null;
    built.forEach((o,k)=>{
      const r=free?free.res[k]:o.b.get();
      if(!o.b.example){
        o.li.classList.remove('ok','bad');o.li.classList.add(r.ok?'ok':'bad');
        o.fb.hidden=false;o.fb.textContent='';
        o.fb.append(el('span',{class:'mark'},r.ok?'✔ Correcto':'✖ Incorrecto'));
        if(!r.ok&&r.msg)o.fb.append(el('p',{class:'msg'},r.msg));
        if(!r.ok&&r.model)o.fb.append(el('p',{class:'model'},'Respuesta correcta: ',el('b',{},r.model)));
      }
      right+=(r.pts!==undefined?r.pts:(r.ok?1:0));o.b.lock();
    });
    if(free&&free.left.length&&!form.querySelector('.listnote'))form.insertBefore(el('p',{class:'listnote'},'Faltaban: ',el('b',{},free.left.join(' · '))),form.querySelector('.btnrow'));
    verify.disabled=true;
    saveAtt(U,ex,right,exTotal(ex),score);
  });
  return form;
}
function doneCard(U,ex){
  const b=best(ex.id);
  return el('section',{class:'card done','aria-labelledby':'exh'},
    el('p',{class:'lab'},'Ejercicio '+ex.lab),el('h2',{id:'exh'},ex.instr),
    el('p',{class:'ok-line'},'✔ Completado · mejor puntuación: '+b+' de '+exTotal(ex)),
    el('div',{class:'btnrow'},el('button',{type:'button',class:'btn ghost',onclick:()=>renderEx(true)},'Repetir')));
}
function renderEx(force){
  const ex=curU.ex[curEx],host=$('gexhost');
  host.textContent='';
  host.append((!force&&best(ex.id)!==undefined)?doneCard(curU,ex):buildEx(curU,ex));
  if(force){const f=host.querySelector('input:not(:disabled)');if(f)f.focus({preventScroll:true});}
}
function renderChips(){
  const box=$('gchips');box.textContent='';
  curU.ex.forEach((ex,i)=>{const b=best(ex.id);
    box.append(el('button',{type:'button',class:'chip2'+(i===curEx?' on':'')+(b!==undefined?' done':''),'aria-current':i===curEx?'true':null,
      onclick:()=>{curEx=i;renderChips();renderEx(false);}},ex.lab,el('small',{},b!==undefined?(b+'/'+exTotal(ex)):'—')));
  });
}
function renderMeta(){
  const st=unitStats(curU);
  $('gmeta').textContent='Unidad '+curU.id+' · '+curU.name+' · '+st.done+' de '+st.n+' ejercicios hechos'+(st.done?(' · '+st.pts+' de '+st.tot+' puntos'):'');
}
function renderWork(){
  const w=$('gwork');w.textContent='';
  w.append(el('div',{class:'gchips',id:'gchips'}),el('div',{id:'gexhost'}));
  renderChips();renderEx(false);
}
/* ---------- pestañas (móvil) ---------- */
function renderTabs(){
  const t=$('mtabs');t.textContent='';
  [['t','Teoría'],['e','Ejercicios']].forEach(([k,l])=>t.append(el('button',{type:'button',class:'tab'+(curTab===k?' on':''),'aria-current':curTab===k?'page':null,onclick:()=>{curTab=k;renderTabs();applyTab();window.scrollTo({top:0});}},l)));
}
function applyTab(){$('gtheory').hidden=curTab!=='t';$('gwork').hidden=curTab!=='e';}
/* ---------- arranque ---------- */
const sel=$('unit');
UNITS.forEach(U=>sel.append(el('option',{value:String(U.id)},'Unidad '+U.id+' · '+U.name)));
sel.addEventListener('change',()=>{curU=UNITS.find(U=>String(U.id)===sel.value)||UNITS[0];curEx=0;renderTheory(curU);renderWork();renderMeta();});
$('who').textContent=store.name;
$('app').hidden=false;
renderTheory(curU);renderWork();renderMeta();renderTabs();applyTab();
});
</script>
