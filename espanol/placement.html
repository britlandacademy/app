<title>Placement test · Britland Academy</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
/* Callan book identity: FreeSet, black and grey, black band with the logo, grey blocks for titles */
:root{
  --bg:#ffffff; --card:#ececec; --surface:#ffffff; --ink:#111111; --muted:#4d4d4d; --line:#b8b8b8;
  --accent:#111111; --accent-ink:#ffffff; --chip:#d9d9d9; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#1d5e2e; --ok-bg:#e3efe5; --bad:#9c2a22; --bad-bg:#f6e4e2; --warn:#6b4a00; --warn-bg:#f3ead0;
  --font-display:'FreeSet','Helvetica Neue',Arial,sans-serif;
  --font-body:'FreeSet','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --card:#242424; --surface:#1a1a1a; --ink:#f2f2f2; --muted:#b5b5b5; --line:#4a4a4a;
  --accent:#f2f2f2; --accent-ink:#111111; --chip:#333333; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#7fd29a; --ok-bg:#183222; --bad:#ff9e94; --bad-bg:#3a1f1d; --warn:#f0c36a; --warn-bg:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --card:#242424; --surface:#1a1a1a; --ink:#f2f2f2; --muted:#b5b5b5; --line:#4a4a4a;
  --accent:#f2f2f2; --accent-ink:#111111; --chip:#333333; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#7fd29a; --ok-bg:#183222; --bad:#ff9e94; --bad-bg:#3a1f1d; --warn:#f0c36a; --warn-bg:#3a2e12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto}
header{padding:8px 0 20px}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.15;margin:0 0 10px;text-wrap:balance}
.intro{max-width:68ch;margin:0;color:var(--ink)}
.rule{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:var(--surface);max-width:68ch}
.rule b{font-weight:700}
.eg{display:block;margin-top:4px;font-family:var(--font-display);font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px 18px 20px;min-width:0}
.card h2{font-family:var(--font-display);font-size:1.25rem;margin:0 0 4px;text-wrap:balance}
.card .lab{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.instr{margin:0 0 12px;color:var(--muted)}
.facts{margin:0 0 14px;padding:10px 12px;background:var(--chip);border-radius:3px;font-size:.97rem}
.facts b{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.item{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;padding:10px 10px 12px;border:1px solid var(--line);border-radius:3px}
.item .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.item.ok{border-color:var(--ok);background:var(--ok-bg)}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
.q{margin:0 0 6px;font-weight:700;font-family:var(--font-display);font-size:1.05rem}
.sit{margin:0 0 6px;font-size:.95rem;color:var(--muted)}
.shown{margin:0 0 8px;font-size:1rem}
.shown s{text-decoration-thickness:2px}
.pic{display:inline-block;font-size:2rem;line-height:1;margin:0 0 6px}
.swatch{display:inline-block;width:44px;height:28px;border-radius:2px;border:2px solid var(--ink);vertical-align:middle;margin:0 0 6px}
.big{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1;margin:0 0 6px}
.ctx{display:block}
input.txt,select{width:100%;min-height:46px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px}
input.txt.inl{width:9em;display:inline-block;margin:2px 4px}
input.txt:disabled,select:disabled{opacity:1;background:transparent}
.cloze{margin:0;font-size:1.05rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 10px;margin:6px 0 0;border:2px solid var(--line);border-radius:3px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--chip)}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.tf{display:flex;gap:8px;flex-wrap:wrap}
.tf .opt{flex:1 1 130px;margin:0}
.area{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:2px dashed var(--line);border-radius:3px;margin:0 0 8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{min-height:44px;min-width:44px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--chip);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.area .chip{background:var(--surface);border-color:var(--accent)}
.chip:disabled{cursor:default}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button.btn{min-height:46px;padding:10px 20px;font:inherit;font-weight:700;border-radius:3px;border:2px solid var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.small{min-height:44px;padding:6px 14px;font:inherit;font-size:.95rem;background:transparent;color:var(--accent);border:2px solid var(--line);border-radius:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{grid-column:2;margin-top:6px;font-size:.97rem}
.fb[hidden]{display:none}
.mark{font-weight:700}
.ok .mark{color:var(--ok)} .bad .mark{color:var(--bad)}
.fb .warn{margin:4px 0 0;padding:6px 10px;background:var(--warn-bg);color:var(--warn);border-radius:2px}
.fb .msg{margin:4px 0 0}
.fb .model{margin:4px 0 0}
.fb .model b{font-family:var(--font-display)}
.score{margin:12px 0 0;font-weight:700;min-height:1.5em}
.total{grid-column:1/-1}
.bar{height:16px;border-radius:99px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin:10px 0}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .4s}
.big-score{font-family:var(--font-display);font-size:1.6rem;font-weight:700;margin:0}
.msgtotal{margin:6px 0 0}
footer{margin-top:24px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar>div{transition:none}}
@media (max-width:400px){.card{padding:14px 12px 16px}.item{grid-template-columns:1.6rem minmax(0,1fr);padding:8px}}
.panel{min-width:0}
.sub{margin:0 0 14px;color:var(--muted);max-width:68ch}
.panel>.card.total{margin-top:18px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.tab{min-height:46px;padding:8px 16px;font:inherit;font-weight:700;color:var(--accent);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.tab.on{border-color:var(--accent);background:var(--chip)}
.tab:disabled{color:var(--muted);cursor:not-allowed;opacity:.8}
.tstat{font-weight:400;font-size:.88rem;color:var(--muted);margin-left:4px}
.locknote{margin:0 0 14px;padding:8px 12px;border-radius:3px;background:var(--warn-bg);color:var(--warn)}
.warnbox{margin:12px 0 0;padding:8px 12px;border-radius:3px;background:var(--warn-bg);color:var(--warn);max-width:68ch}
.welcome{max-width:520px}
.err{margin:6px 0 0;color:var(--bad);min-height:1.2em}
.card.done{display:flex;flex-direction:column}
.ok-line{margin:0 0 4px;color:var(--ok);font-weight:700}
.hsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:0 0 16px}
.hbox{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--surface)}
.hbox .big-score{margin:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:380px;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
caption{padding:8px 10px;text-align:left}
textarea.rep{width:100%;margin-top:12px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:8px 12px}
a.btn{display:inline-flex;align-items:center;min-height:46px;padding:10px 20px;font-weight:700;border-radius:3px;border:2px solid var(--accent);text-decoration:none;color:var(--accent)}
button.btn.danger{border-color:var(--bad);color:var(--bad)}
.tagline{margin:0 0 4px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.band{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;background:var(--band);color:var(--band-ink);padding:22px 20px;border:1px solid var(--line)}
.band .logo{width:150px;height:auto;flex:none;color:#fff}
.band .eyebrow{color:var(--band-muted);margin:0 0 4px}
.band h1{color:#fff;margin:0 0 6px}
.band .intro{color:var(--band-muted)}
.band>div{min-width:0;flex:1 1 260px}
h2.sep{background:var(--chip);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:clamp(1.3rem,4.6vw,1.9rem);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;padding:14px 16px}
.card{background:var(--card);border:0}
.item,input.txt,select,.opt,.chip,.hbox,.tblwrap,textarea.rep,.rule{background:var(--surface)}
.facts{background:var(--chip)}
button.primary{background:var(--accent);color:var(--accent-ink)}
.tab{color:var(--ink);background:var(--surface)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.on .tstat{color:var(--accent-ink)}
.opt:has(input:checked){background:var(--chip)}
.area .chip{background:var(--chip)}
.band .teacher{margin:10px 0 0;color:#fff;font-weight:700;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip2{min-width:48px;min-height:46px;padding:6px 10px;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip2 small{font-weight:400;font-size:.72rem;color:var(--muted)}
.chip2.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip2.on small{color:var(--accent-ink)}
.chip2.done{border-color:var(--ok)}
.chip2:disabled{color:var(--muted);cursor:not-allowed;opacity:.75}
.audio{margin:0 0 16px;padding:12px 14px;background:var(--card);border-radius:3px}
.audio audio{width:100%;display:block;margin:6px 0 8px}
.audio .spd{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.audio .spd button{min-height:44px;min-width:56px;padding:4px 10px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.audio .spd button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.audio .lab{margin:0}
.audio .ap+.ap{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rwtxt{margin-top:8px}
.rwtxt label{display:block;font-size:.85rem;color:var(--muted);margin:0 0 4px}
.rwtxt input.txt{width:12em;max-width:100%}
#t-back{display:none!important}</style>

<style>
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
@media (max-width:420px){.pick{grid-template-columns:1fr}}
.pick label{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.pick select{width:100%;min-height:50px;padding:8px 12px;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px}
.nav{display:flex;gap:10px;margin:0 0 14px}
.nav button{flex:1;min-height:48px;padding:8px 14px;font:inherit;font-weight:700;color:var(--accent);background:transparent;border:2px solid var(--accent);border-radius:3px;cursor:pointer}
.nav button:disabled{opacity:.45;cursor:not-allowed}
.stage{max-width:720px}
</style>

<header>
    <div class="band"><div class="bl-lock stack"><img src="img/britland-shield.png" alt="" width="62" height="72"><span class="bl-name"><b>BRITLAND</b><i>ACADEMY</i></span></div><div><h1>Placement test</h1><p class="intro">Find your level. It takes about 10 minutes.</p></div></div>

<style>
.pl{max-width:760px;margin:0 auto;padding:0 16px 40px}
.pl .card{padding:18px 18px 20px;margin:16px 0}
.pl label.f{display:block;font-weight:700;margin:14px 0 4px}
.pl input.fld{width:100%;min-height:46px;padding:8px 10px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;box-sizing:border-box}
.pl .prog{height:8px;background:var(--chip);border-radius:6px;margin:0 0 14px;overflow:hidden}
.pl .prog>div{height:100%;width:0;background:var(--accent);transition:width .2s}
.pl .qtext{font-size:1.15rem;font-weight:700;margin:6px 0 10px;overflow-wrap:anywhere}
.pl .passage{background:var(--chip);padding:12px 14px;border-radius:8px;margin:0 0 10px;overflow-wrap:anywhere}
.pl .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pl .btn{min-height:46px;padding:10px 20px;font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--accent);background:transparent;color:var(--accent)}
.pl .btn .fl{display:inline-flex;vertical-align:middle;margin-right:12px}.pl .btn .fl svg{width:34px;height:34px}.pl #s-lang .btn{display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.pl #r-path{margin:6px 0 14px}.pl #r-path .cv-path{margin:0}.pl #r-path .cv-p{opacity:0;animation:plin .5s ease forwards}
.pl #r-path .cv-p.cur .cv-img{box-shadow:0 0 0 3px #F5C542,0 0 18px rgba(245,197,66,.7);animation:plpulse 1.2s ease 1.6s 2}
.pl .big.pop{animation:plpop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes plin{from{opacity:0;transform:translateY(10px) scale(.85)}to{opacity:1;transform:none}}
@keyframes plpop{0%{transform:scale(1)}40%{transform:scale(1.35);color:#F5C542}100%{transform:scale(1)}}
@keyframes plpulse{50%{transform:scale(1.12)}}
@media(prefers-reduced-motion:reduce){.pl #r-path .cv-p,.pl .big.pop,.pl #r-path .cv-p.cur .cv-img{animation:none!important;opacity:1}}
.pl .btn.primary{background:var(--accent);color:var(--accent-ink)}
.pl .btn[disabled]{opacity:.5;cursor:default}
.pl .err{color:var(--bad);font-weight:700;min-height:1.3em;margin:10px 0 0}
.pl .big{font-size:2.2rem;font-weight:700;margin:6px 0}
.pl .note{color:var(--muted);font-size:.92rem}
.topbar{display:flex;justify-content:flex-end;gap:10px;max-width:760px;margin:0 auto;padding:8px 16px 0}
</style>

</section>
<section class="card" id="s-q" hidden>

  </div>

  <p id="r-congrats" style="font-size:1.1rem;font-weight:700"></p>
  <p>Tu profesor confirmará tu nivel.</p>
  <p id="r-cta"></p>
  <p class="note" id="r-save" aria-live="polite"></p>
</section>

var EXTRA={"es": [[{"t": "mc", "q": "Mi hermana ___ estudiante.", "o": ["es", "soy", "eres"], "a": 0}, {"t": "mc", "q": "Nosotros ___ de Brasil.", "o": ["somos", "son", "soy"], "a": 0}, {"t": "mc", "q": "¿Cómo ___ tú?", "o": ["te llamas", "se llama", "me llamo"], "a": 0}, {"t": "mc", "q": "Ellos ___ en una casa pequeña.", "o": ["vive", "viven", "vivimos"], "a": 1}, {"t": "rd", "text": "Tomás tiene veinte años. Es camarero en un restaurante pequeño. Tiene un perro que se llama Max.", "q": "¿Cuál es el trabajo de Tomás?", "o": ["Profesor", "Camarero", "Médico"], "a": 1}, {"t": "rd", "text": "Esta es mi familia. Mi padre se llama Carlos y mi madre se llama Rita. Tengo un hermano. Se llama Pedro.", "q": "¿Cuántos hermanos tiene el hablante?", "o": ["Ninguno", "Uno", "Dos"], "a": 1}], [{"t": "mc", "q": "Mi hermano ___ al fútbol los domingos.", "o": ["juega", "juegas", "jugamos"], "a": 0}, {"t": "mc", "q": "Yo ___ el desayuno a las siete.", "o": ["tomo", "toma", "tomas"], "a": 0}, {"t": "mc", "q": "¿A qué hora ___ tú del trabajo?", "o": ["sales", "salgo", "sale"], "a": 0}, {"t": "mc", "q": "No ___ café por la noche.", "o": ["bebo", "bebe", "beben"], "a": 0}, {"t": "rd", "text": "Sara trabaja en una tienda del centro. Empieza a las nueve y termina a las seis. Los sábados no trabaja, así que va de compras con sus amigas.", "q": "¿Cuándo va de compras con sus amigas?", "o": ["Entre semana", "Los sábados", "Los domingos"], "a": 1}, {"t": "rd", "text": "Nuestra escuela tiene dos plantas. Las aulas están arriba y la biblioteca está abajo. La cafetería está al lado de la biblioteca.", "q": "¿Dónde está la biblioteca?", "o": ["Arriba", "Abajo", "En la cafetería"], "a": 1}], [{"t": "mc", "q": "¡Silencio! El bebé ___ .", "o": ["duerme", "está durmiendo", "durmió"], "a": 1}, {"t": "mc", "q": "En el parque ___ mucha gente hoy.", "o": ["hay", "están", "es"], "a": 0}, {"t": "mc", "q": "Necesito ___ leche para el café.", "o": ["algo de", "alguna", "unos"], "a": 0}, {"t": "mc", "q": "¿Cuánto ___ este libro?", "o": ["cuesta", "cuestan", "cuestas"], "a": 0}, {"t": "rd", "text": "Ken está en la estación. Espera el tren de las nueve a Londres. Está lloviendo, así que lleva abrigo y paraguas.", "q": "¿Por qué lleva abrigo?", "o": ["Hace calor", "Está lloviendo", "Va a Londres"], "a": 1}, {"t": "rd", "text": "El supermercado de la calle Mayor abre todos los días de ocho a diez. Dentro hay una panadería y el pan siempre está fresco. El aparcamiento es gratuito durante dos horas.", "q": "¿Cuánto tiempo es gratis el aparcamiento?", "o": ["Una hora", "Dos horas", "Todo el día"], "a": 1}], [{"t": "mc", "q": "Cuando llamaste, yo ___ la cena.", "o": ["preparaba", "preparé", "prepararé"], "a": 0}, {"t": "mc", "q": "El verano pasado ___ a Italia en tren.", "o": ["viajamos", "viajaremos", "viajamos a"], "a": 0}, {"t": "mc", "q": "Ayer no ___ la película porque estaba cansado.", "o": ["vi", "veo", "vería"], "a": 0}, {"t": "mc", "q": "Ella es ___ alta que su hermano.", "o": ["más", "muy", "tan"], "a": 0}, {"t": "rd", "text": "Anoche me quedé en casa. Cociné pasta, vi una película y me acosté a las once. Esta mañana me desperté tarde y perdí el autobús, así que fui andando al trabajo.", "q": "¿Cómo fue al trabajo el hablante?", "o": ["En autobús", "A pie", "En coche"], "a": 1}, {"t": "rd", "text": "María perdió su cartera el lunes. La buscó por toda la casa y luego llamó al café donde había comido. Un camarero la había encontrado debajo de una mesa y ella la recogió el martes.", "q": "¿Dónde estaba la cartera?", "o": ["En casa", "Debajo de una mesa del café", "En el autobús"], "a": 1}], [{"t": "mc", "q": "Este fin de semana ___ a visitar a mis abuelos.", "o": ["voy", "iba", "fui"], "a": 0}, {"t": "mc", "q": "En el hospital no se ___ fumar.", "o": ["puede", "poder", "pueda"], "a": 0}, {"t": "mc", "q": "Es la ___ película que he visto nunca.", "o": ["mejor", "más buena", "buenísimo"], "a": 0}, {"t": "mc", "q": "Si estudias mucho, ___ el examen.", "o": ["aprobarás", "aprobaras", "aprobaste"], "a": 0}, {"t": "rd", "text": "El mes que viene Pablo se mudará a un piso más grande. Tiene dos dormitorios y balcón. El alquiler es más alto, pero cree que merece la pena porque está cerca de su oficina.", "q": "¿Por qué cree Pablo que merece la pena?", "o": ["Es barato", "Está cerca de su oficina", "Tiene jardín"], "a": 1}, {"t": "rd", "text": "El gimnasio ofrece dos tipos de abono. El básico cuesta 20 euros al mes e incluye la piscina. El premium cuesta 35 euros e incluye también clases.", "q": "¿Qué incluye solo el abono premium?", "o": ["La piscina", "Clases", "Aparcamiento"], "a": 1}], [{"t": "mc", "q": "Llevan casados veinte años; se casaron ___ 2005.", "o": ["en", "desde", "hace"], "a": 0}, {"t": "mc", "q": "He perdido las llaves y no las encuentro ___ .", "o": ["en ninguna parte", "en alguna parte", "nunca"], "a": 0}, {"t": "mc", "q": "Me dijo que ___ cansada.", "o": ["estaba", "está", "estuvo"], "a": 0}, {"t": "mc", "q": "No lo veo ___ las Navidades pasadas.", "o": ["desde", "durante", "hace"], "a": 0}, {"t": "rd", "text": "Conozco a Julia desde hace diez años. Nos conocimos en la universidad y compartimos piso desde entonces. Acaba de conseguir un trabajo en Madrid, así que el año que viene no viviremos juntas. Me alegro por ella, pero la echaré de menos.", "q": "¿Qué ha pasado recientemente?", "o": ["Julia ha conseguido trabajo en Madrid", "Julia se ha mudado de piso", "La hablante cambió de trabajo"], "a": 0}, {"t": "rd", "text": "La biblioteca municipal está cerrada por obras desde marzo. Reabrirá en septiembre con una sección infantil más grande. Mientras tanto, los lectores pueden pedir libros prestados en una biblioteca móvil que pasa los jueves.", "q": "¿Qué pueden hacer los lectores mientras tanto?", "o": ["Nada", "Usar una biblioteca móvil", "Leer solo en línea"], "a": 1}], [{"t": "mc", "q": "Te llamaré en cuanto ___ a casa.", "o": ["llegue", "llegaré", "llegué"], "a": 0}, {"t": "mc", "q": "¡Me lo ___ haber dicho antes! Ahora es tarde.", "o": ["tenías que", "deberías", "debes"], "a": 1}, {"t": "mc", "q": "La película era tan ___ que me dormí.", "o": ["aburrida", "aburrido", "aburrimiento"], "a": 0}, {"t": "mc", "q": "Me preguntó dónde ___ .", "o": ["vivía", "vivo", "viviré"], "a": 0}, {"t": "rd", "text": "Se recuerda a los clientes que la tienda cerrará antes el viernes por inventario. Los pedidos en línea realizados después del mediodía del jueves se enviarán el lunes. Pedimos disculpas por las molestias.", "q": "¿Cuándo se enviarán los pedidos del jueves por la tarde?", "o": ["El viernes", "El lunes", "El jueves"], "a": 1}, {"t": "rd", "text": "Cuando Miguel empezó a ir al trabajo en bicicleta, le resultaba agotador. Al cabo de un mes se sentía en mejor forma y empezó a disfrutarlo. Ahora también la usa los fines de semana y ha perdido cinco kilos.", "q": "¿Cómo se sentía Miguel al cabo de un mes?", "o": ["Agotado", "En mejor forma", "Aburrido"], "a": 1}], [{"t": "mc", "q": "Si yo ___ tú, pediría perdón.", "o": ["fuera", "soy", "seré"], "a": 0}, {"t": "mc", "q": "Está acostumbrada a ___ temprano.", "o": ["levantarse", "levantó", "levantaba"], "a": 0}, {"t": "mc", "q": "El puente ___ en 1890.", "o": ["se construyó", "construyó", "construía"], "a": 0}, {"t": "mc", "q": "Tengo ganas de ___ la semana que viene.", "o": ["verte", "te ver", "viéndote"], "a": 0}, {"t": "rd", "text": "Ana siempre había soñado con tener su propia panadería. El año pasado dejó su trabajo de oficina, pidió un préstamo y abrió una pequeña tienda. Al principio fue difícil, pero pronto los clientes empezaron a hacer cola cada mañana.", "q": "¿Qué pasó poco después de abrir la tienda?", "o": ["Cerró", "Los clientes hacían cola", "Ana volvió a la oficina"], "a": 1}, {"t": "rd", "text": "Unos científicos han descubierto que quienes duermen menos de seis horas tienen más probabilidades de resfriarse. Los investigadores creen que el cuerpo necesita dormir para producir las sustancias que combaten las infecciones.", "q": "¿Qué creen los investigadores?", "o": ["Los resfriados causan mal sueño", "Dormir ayuda a combatir infecciones", "Hay que dormir nueve horas"], "a": 1}], [{"t": "mc", "q": "Ojalá ___ ido a la fiesta anoche.", "o": ["hubiera", "habría", "haya"], "a": 0}, {"t": "mc", "q": "Cuando llegamos, la película ya ___ .", "o": ["había empezado", "empezó", "empezaba"], "a": 0}, {"t": "mc", "q": "Negó ___ el dinero.", "o": ["haber cogido", "coger", "cogiendo"], "a": 0}, {"t": "mc", "q": "No solo llegó tarde, ___ olvidó los documentos.", "o": ["sino que", "pero", "aunque"], "a": 0}, {"t": "rd", "text": "El ayuntamiento ha decidido prohibir los coches en el centro los domingos. Sus defensores dicen que reducirá la contaminación y hará las calles más seguras, mientras que los comerciantes temen perder clientes.", "q": "¿Por qué están preocupados los comerciantes?", "o": ["Aumentará la contaminación", "Pueden perder clientes", "Las calles serán inseguras"], "a": 1}, {"t": "rd", "text": "Aunque el restaurante recibió críticas excelentes, el dueño admitió que el primer año fue muy duro. La falta de personal y la subida de precios casi lo obligan a cerrar, pero los clientes fieles mantuvieron el negocio.", "q": "¿Qué salvó al restaurante?", "o": ["Las críticas excelentes", "Los clientes fieles", "Los precios más bajos"], "a": 1}], [{"t": "mc", "q": "Insistió ___ pagar la cuenta.", "o": ["en", "a", "de"], "a": 0}, {"t": "mc", "q": "Preferiría que me ___ la verdad.", "o": ["dijeras", "dices", "dirás"], "a": 0}, {"t": "mc", "q": "Se dice que la empresa ___ perdiendo dinero.", "o": ["está", "esté", "estaría"], "a": 0}, {"t": "mc", "q": "De haber sabido del retraso, ___ antes.", "o": ["habría salido", "saldría", "salí"], "a": 0}, {"t": "rd", "text": "La crítica ha elogiado la novela por sus personajes vívidos, pero algunos opinan que la trama es previsible. Aun así, el libro ha vendido más de un millón de ejemplares, lo que sugiere que los lectores valoran más la atmósfera que la sorpresa.", "q": "¿Qué sugiere el éxito del libro?", "o": ["Que los lectores quieren tramas sorprendentes", "Que los lectores valoran la atmósfera", "Que la crítica tenía razón"], "a": 1}, {"t": "rd", "text": "La nueva normativa obliga a los empleadores a llevar un registro de las horas extra. El incumplimiento puede conllevar multas elevadas, aunque las pequeñas empresas tendrán seis meses más para adaptarse.", "q": "¿Quién tiene más tiempo para adaptarse?", "o": ["Las grandes empresas", "Las pequeñas empresas", "Los empleados"], "a": 1}], [{"t": "mc", "q": "Nunca antes ___ una actuación tan convincente.", "o": ["había visto", "vería", "viendo"], "a": 0}, {"t": "mc", "q": "Se mostraba reacio ___ responsabilidad alguna por el error.", "o": ["a asumir", "en asumir", "de asumir"], "a": 0}, {"t": "mc", "q": "La huelga paralizó la ciudad: todo quedó ___ .", "o": ["paralizado", "a paralizar", "por paralizar"], "a": 0}, {"t": "mc", "q": "Apenas había empezado la reunión ___ se fue la luz.", "o": ["cuando", "que", "y"], "a": 0}, {"t": "rd", "text": "Las declaraciones del ministro, aunque envueltas en lenguaje diplomático, dejaron pocas dudas de que el Gobierno pretende reducir el programa. Los líderes de la oposición no tardaron en aprovechar el aparente cambio de rumbo y acusaron a los ministros de engañar a los votantes.", "q": "¿De qué acusó la oposición a los ministros?", "o": ["De subir los impuestos", "De engañar a los votantes", "De ignorar el parlamento"], "a": 1}, {"t": "rd", "text": "Lejos de ser una mera curiosidad, el hallazgo ha desmontado décadas de supuestos sobre los primeros asentamientos de la región. Los arqueólogos creen ahora que las primeras comunidades llegaron al menos dos mil años antes de lo que se pensaba.", "q": "¿Qué ha cambiado el hallazgo?", "o": ["La edad de las ciudades modernas", "Los supuestos sobre los primeros asentamientos", "La ubicación del yacimiento"], "a": 1}], [{"t": "mc", "q": "El informe no estuvo ___ de las expectativas, pese a la generosa financiación.", "o": ["a la altura", "en la altura", "a nivel"], "a": 0}, {"t": "mc", "q": "Era la discreción ___ ; nadie la oyó jamás cotillear.", "o": ["personificada", "personificar", "personificando"], "a": 0}, {"t": "mc", "q": "Su argumento, aunque aparentemente persuasivo, no ___ un análisis riguroso.", "o": ["resiste", "persiste", "insiste"], "a": 0}, {"t": "mc", "q": "Ni siquiera imaginaban que el acuerdo ___ fracasado ya.", "o": ["había", "haya", "habría"], "a": 0}, {"t": "rd", "text": "La prosa de la autora, a un tiempo austera y lírica, se resiste a la paráfrasis fácil. Donde otros escritores insistirían en un punto, ella lo insinúa de manera oblicua y confía en que el lector complete lo que queda sin decir.", "q": "¿Qué distingue el estilo de la autora?", "o": ["Insiste en cada punto", "Es indirecto y confía en el lector", "Es fácil de parafrasear"], "a": 1}, {"t": "rd", "text": "Que la política tuviera buenas intenciones está fuera de discusión; que estuviera bien concebida es otro asunto. Sus artífices subestimaron tanto el coste de la aplicación como la resistencia que opondrían las autoridades locales.", "q": "¿Qué critica el autor?", "o": ["Las intenciones de la política", "Lo bien diseñada que estaba", "La financiación local"], "a": 1}]]};

  AUD=new Audio(item.mp3);AUD.playbackRate=rate;
  AUD.onerror=function(){if(!speak(item.say,rate===1?.9:.6))note.textContent=item.say;};
  var p=AUD.play();if(p&&p.catch)p.catch(function(){if(!speak(item.say,rate===1?.9:.6))note.textContent=item.say;});
}
var canSpeak=('speechSynthesis' in window);
var LN={en:['English','inglês','inglés'],es:['Spanish','espanhol','español'],pt:['Portuguese','português','portugués']};
function lname(t){var u=ui();return LN[t][u==='pt'?1:u==='es'?2:0];}
function texts(){
  $('t-h2').textContent=T('Placement test');
  $('t-p1').textContent=T('Answer the questions to find the best level for you. Choose "I don\'t know" if you are not sure: do not guess.');
  $('t-p2').textContent=T('This test is in {0}. The questions get harder step by step. The test stops when the questions become too difficult for you.').replace('{0}',S.test?lname(S.test):'');
  $('t-lang-sub').textContent=T('I want to learn...');
  $('t-back').textContent=T('Change language');
  ['en','es','pt'].forEach(function(t){var n=lname(t);document.querySelector('#b-'+t+' .bn').textContent=n.charAt(0).toUpperCase()+n.slice(1);});
}
function render(){
  var item=BANK[S.lvl][S.idx],box=$('qbox');box.textContent='';$('e-q').textContent='';
  var order=shuf([0,1,2]);S.cur={item:item,order:order,sel:null};
  var n=S.total+1;
  box.append(el('p',{class:'note'},T('Question {0}').replace('{0}',n)));
  if(item.t==='rd')box.append(el('p',{class:'passage','data-noi18n':'1'},item.text));
  if(item.t==='li'){
    var note=el('p',{class:'note','data-noi18n':'1'});
    if(canSpeak||item.mp3){
      box.append(el('div',{class:'btnrow',style:'margin:0 0 10px'},
        el('button',{type:'button',class:'btn',onclick:function(){play(item,1,note);}},'▶ '+T('Listen')),
        el('button',{type:'button',class:'btn',onclick:function(){play(item,.75,note);}},'▶ '+T('Slowly'))));
      box.append(note);
    }else{box.append(el('p',{class:'passage','data-noi18n':'1'},item.say));}
  }
  box.append(el('p',{class:'qtext','data-noi18n':'1'},item.q));
  var name='q'+n;
  order.concat([-1]).forEach(function(oi){
    var r=el('input',{type:'radio',name:name,value:String(oi),onchange:function(){S.cur.sel=oi;$('e-q').textContent='';}});
    box.append(el('label',{class:'opt'},r,oi<0?el('span',{},T("I don't know")):el('span',{'data-noi18n':'1'},item.o[oi])));
  });
  $('pbar').style.width=Math.round(n/36*100)+'%';
}
var CEFR=['A1-','A1','A1+','A2-','A2','A2+','B1-','B1','B1+','B2-','B2','B2+','C1-','C1','C1+','C2-','C2'];
var MSG={
 A:'Congratulations! 🎉 You finished the test and you already have a base to build on. The hardest part is starting, and you have started.',
 B1:'Well done! 👏 You already communicate in everyday situations and have a good base. With a little guided practice, your fluency will grow fast.',
 B2:'Excellent result! 🌟 You understand and express yourself with confidence. The next step is gaining precision and naturalness.',
 C:'Impressive! 🏆 You have a very solid command of the language. Now the work is refining the details and getting closer to native speech.'
};
function band(c){var l=c.charAt(0)+c.charAt(1);return l==='A1'||l==='A2'?'A':l==='B1'?'B1':l==='B2'?'B2':'C';}
function etapa(level){return Math.min(6,Math.ceil(level/2));}
function finish(level,passedAll,partial){
  S.done=true;
  var x=passedAll?12:(level-1)+(partial||0)*0.5;
  var cef=CEFR[Math.min(16,Math.round(x*16/12))];
  S.cefr=cef;S.level=level;
  paint(true);save(level);
}
function paint(fx){
  var level=S.level,cef=S.cefr;
  $('r-lvl').textContent=T('Your {0} level (approximate):').replace('{0}',lname(S.test));
  $('r-cefr').textContent=cef;
  var cta;
  if(S.test==='en'){
    var r=STG[level-1];
    $('r-stage-box').hidden=false;
    $('r-stage').textContent=T('Stage {0}').replace('{0}',level);
    $('r-lessons').textContent=T('Lessons {0} to {1}').replace('{0}',r[0]).replace('{1}',r[1]);
    cta=T('Talk to us to start at {0}.').replace('{0}',T('Stage {0}').replace('{0}',level));
  }else if(S.test==='es'){
    var e=etapa(level);
    $('r-stage-box').hidden=false;
    $('r-stage').textContent=T('Stage {0}').replace('{0}',e);
    $('r-lessons').textContent='';
    cta=T('Talk to us to start at {0}.').replace('{0}',T('Stage {0}').replace('{0}',e));
  }else{
    $('r-stage-box').hidden=true;
    cta=T('Talk to us to start your classes.');
  }
  $('r-score').textContent=T('Score: {0}').replace('{0}',S.right+' / '+S.total);
  $('r-congrats').textContent=T(MSG[band(cef)]);
  $('r-cta').textContent=cta;
  show('s-res');
  if(fx)celebrate(level);
}
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function celebrate(level){
  var cef=S.cefr,idx=CEFR.indexOf(cef),box=$('r-cefr'),path=$('r-path');path.textContent='';
  if((S.test==='en'||S.test==='es')&&window.Covers){
    var es=S.test==='es',st=es?etapa(level):level;path.append(Covers.path({es:es,state:function(i){return {cls:i<st?'done':i===st?'cur':'lock'};}}));
    Array.prototype.forEach.call(path.querySelectorAll('.cv-p'),function(e,i){e.style.animationDelay=(i*.09)+'s';});
  }
  if(RM||idx<0){box.textContent=cef;}
  else{var k=0,step=Math.max(70,1500/Math.max(1,idx+1));box.textContent=CEFR[0];
    (function tick(){if(k>=idx){box.textContent=cef;box.classList.add('pop');
        if(idx>=3&&window.Covers){Covers.confetti(S.test==='en'?level:S.test==='es'?etapa(level):1);Covers.chime();}return;}
      k++;box.textContent=CEFR[k];setTimeout(tick,step);})();}
}
function save(level){
  var msg=$('r-save');
  function fail(){msg.textContent=T('Your result could not be sent to your teacher. Take a screenshot of this page and send it to him.');}
  function go(){
    try{
      var c=window.supabase.createClient(window.CALLAN_CFG.url,window.CALLAN_CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
      var row={name:S.name,contact:S.contact,level:level,cefr:S.cefr,score:S.right,total:S.total,ui_lang:ui(),answers:S.log,test_lang:S.test};
      c.from('placement').insert(row).then(function(r){
        if(!r.error){msg.textContent=T('Your result was sent to your teacher.');return;}
        delete row.test_lang;row.answers={lang:S.test,log:S.log};
        c.from('placement').insert(row).then(function(r2){if(r2.error)fail();else msg.textContent=T('Your result was sent to your teacher.');},fail);
      },fail);
    }catch(e){fail();}
  }
  if(window.supabase&&window.supabase.createClient)return go();
  var LIB=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'],i=0;
  (function nxt(){
    if(i>=LIB.length)return fail();
    var s=document.createElement('script');s.src=LIB[i++];
    s.onload=function(){if(window.supabase)go();else nxt();};s.onerror=nxt;document.head.append(s);
  })();
}
function chooseTest(t){
  S.test=t;BANK=BANKS[t].map(function(lv,i){var li=lv.filter(function(x){return x.t==='li'}),rest=lv.filter(function(x){return x.t!=='li'}).concat(EXTRA[t][i]);rest.sort(function(){return Math.random()-.5});return li.concat(rest).slice(0,3)});S.done=false;
  var al=ALLOWED[t];
  if(window.I18N&&al.indexOf(ui())<0)window.I18N.set(al[0]);
  $('top').hidden=(al.length<2);
  Array.prototype.forEach.call(document.querySelectorAll('#top .lang-btn'),function(o){o.hidden=(al.indexOf(o.getAttribute('data-l'))<0);});
  texts();show('s-start');
}
['en','es','pt'].forEach(function(t){$('b-'+t).addEventListener('click',function(){chooseTest(t);});});
$('t-back').addEventListener('click',function(){S.test='';$('top').hidden=false;Array.prototype.forEach.call(document.querySelectorAll('#top .lang-btn'),function(o){o.hidden=false;});S.done=false;texts();show('s-lang');});
window.addEventListener('langchange',function(){
  if(S.test&&ALLOWED[S.test].indexOf(ui())<0){window.I18N.set(ALLOWED[S.test][0]);return;}
  texts();
  if(!$('s-res').hidden&&S.cefr){finish_text();}
});
function finish_text(){paint();}
$('f-start').addEventListener('submit',function(ev){
  ev.preventDefault();var n=$('f-name').value.trim().replace(/\s+/g,' '),c=$('f-contact').value.trim();
  if(!n){$('e-start').textContent=T('Type your name.');return;}
  if(!c||c.length<5){$('e-start').textContent=T('Type your WhatsApp or e-mail.');return;}
  S.name=n;S.contact=c;S.lvl=0;S.idx=0;S.right=0;S.total=0;S.log=[];S.lvlRight=0;S.done=false;
  show('s-q');render();
});
$('next').addEventListener('click',function(){
  if(S.done)return;
  if(S.cur.sel===null){$('e-q').textContent=T('Choose an answer.');return;}
  var ok=S.cur.sel===S.cur.item.a;
  S.total++;if(ok)S.right++;S.log.push([S.lvl+1,S.idx+1,S.cur.sel<0?-1:(ok?1:0)]);
  S.lvlRight=(S.lvlRight||0)+(ok?1:0);
  S.idx++;
  if(S.idx<3){render();return;}
  var passed=S.lvlRight>=2,part=S.lvlRight;S.lvlRight=0;S.idx=0;
  if(!passed)return finish(S.lvl+1,false,part);
  if(S.lvl===11)return finish(12,true);
  S.lvl++;render();
});
window.PLACEMENT={state:S,banks:BANKS};
texts();
chooseTest('es');

</script>
