<title>Workbook · Britland Academy</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1733"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Britland"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script src="js/pwa.js" defer></script>

/* Callan book identity: FreeSet, black and grey, black band with the logo, grey blocks for titles */
:root{
  --bg:#ffffff; --card:#ececec; --surface:#ffffff; --ink:#111111; --muted:#4d4d4d; --line:#b8b8b8;
  --accent:#111111; --accent-ink:#ffffff; --chip:#d9d9d9; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#1d5e2e; --ok-bg:#e3efe5; --bad:#9c2a22; --bad-bg:#f6e4e2; --warn:#6b4a00; --warn-bg:#f3ead0;
  --font-display:'FreeSet','Helvetica Neue',Arial,sans-serif;
  --font-body:'FreeSet','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --card:#242424; --surface:#1a1a1a; --ink:#f2f2f2; --muted:#b5b5b5; --line:#4a4a4a;
  --accent:#f2f2f2; --accent-ink:#111111; --chip:#333333; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#7fd29a; --ok-bg:#183222; --bad:#ff9e94; --bad-bg:#3a1f1d; --warn:#f0c36a; --warn-bg:#3a2e12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141414; --card:#242424; --surface:#1a1a1a; --ink:#f2f2f2; --muted:#b5b5b5; --line:#4a4a4a;
  --accent:#f2f2f2; --accent-ink:#111111; --chip:#333333; --band:#000000; --band-ink:#ffffff; --band-muted:#cfcfcf;
  --ok:#7fd29a; --ok-bg:#183222; --bad:#ff9e94; --bad-bg:#3a1f1d; --warn:#f0c36a; --warn-bg:#3a2e12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1120px;margin:0 auto}
header{padding:8px 0 20px}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.15;margin:0 0 10px;text-wrap:balance}
.intro{max-width:68ch;margin:0;color:var(--ink)}
.rule{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:3px;background:var(--surface);max-width:68ch}
.rule b{font-weight:700}
.eg{display:block;margin-top:4px;font-family:var(--font-display);font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:18px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:18px 18px 20px;min-width:0}
.card h2{font-family:var(--font-display);font-size:1.25rem;margin:0 0 4px;text-wrap:balance}
.card .lab{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.instr{margin:0 0 12px;color:var(--muted)}
.facts{margin:0 0 14px;padding:10px 12px;background:var(--chip);border-radius:3px;font-size:.97rem}
.facts b{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
ol.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.item{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:8px;padding:10px 10px 12px;border:1px solid var(--line);border-radius:3px}
.item .n{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.item.ok{border-color:var(--ok);background:var(--ok-bg)}
.item.bad{border-color:var(--bad);background:var(--bad-bg)}
.q{margin:0 0 6px;font-weight:700;font-family:var(--font-display);font-size:1.05rem}
.sit{margin:0 0 6px;font-size:.95rem;color:var(--muted)}
.shown{margin:0 0 8px;font-size:1rem}
.shown s{text-decoration-thickness:2px}
.pic{display:inline-block;font-size:2rem;line-height:1;margin:0 0 6px}
.swatch{display:inline-block;width:44px;height:28px;border-radius:2px;border:2px solid var(--ink);vertical-align:middle;margin:0 0 6px}
.big{display:inline-block;font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1;margin:0 0 6px}
.ctx{display:block}
input.txt,select{width:100%;min-height:46px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px}
input.txt.inl{width:9em;display:inline-block;margin:2px 4px}
input.txt:disabled,select:disabled{opacity:1;background:transparent}
.cloze{margin:0;font-size:1.05rem}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.opt{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 10px;margin:6px 0 0;border:2px solid var(--line);border-radius:3px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--chip)}
.opt input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.opt span{min-width:0;overflow-wrap:anywhere}
.tf{display:flex;gap:8px;flex-wrap:wrap}
.tf .opt{flex:1 1 130px;margin:0}
.area{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;border:2px dashed var(--line);border-radius:3px;margin:0 0 8px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.chip{min-height:44px;min-width:44px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--chip);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.area .chip{background:var(--surface);border-color:var(--accent)}
.chip:disabled{cursor:default}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button.btn{min-height:46px;padding:10px 20px;font:inherit;font-weight:700;border-radius:3px;border:2px solid var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.small{min-height:44px;padding:6px 14px;font:inherit;font-size:.95rem;background:transparent;color:var(--accent);border:2px solid var(--line);border-radius:3px;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{grid-column:2;margin-top:6px;font-size:.97rem}
.fb[hidden]{display:none}
.mark{font-weight:700}
.ok .mark{color:var(--ok)} .bad .mark{color:var(--bad)}
.fb .warn{margin:4px 0 0;padding:6px 10px;background:var(--warn-bg);color:var(--warn);border-radius:2px}
.fb .msg{margin:4px 0 0}
.why{margin:8px 0 0}.why-btn{font-weight:600}.why-txt{margin:6px 0 0;padding:8px 10px;border-left:3px solid var(--accent);background:var(--surface);border-radius:6px}
.fb .model{margin:4px 0 0}
.fb .model b{font-family:var(--font-display)}
.score{margin:12px 0 0;font-weight:700;min-height:1.5em}
.total{grid-column:1/-1}
.bar{height:16px;border-radius:99px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin:10px 0}
.bar>div{height:100%;width:0;background:var(--accent);transition:width .4s}
.big-score{font-family:var(--font-display);font-size:1.6rem;font-weight:700;margin:0}
.msgtotal{margin:6px 0 0}
footer{margin-top:24px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar>div{transition:none}}
@media (max-width:400px){.card{padding:14px 12px 16px}.item{grid-template-columns:1.6rem minmax(0,1fr);padding:8px}}
.panel{min-width:0}
.sub{margin:0 0 14px;color:var(--muted);max-width:68ch}
.panel>.card.total{margin-top:18px}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.tab{min-height:46px;padding:8px 16px;font:inherit;font-weight:700;color:var(--accent);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.tab.on{border-color:var(--accent);background:var(--chip)}
.tab:disabled{color:var(--muted);cursor:not-allowed;opacity:.8}
.tstat{font-weight:400;font-size:.88rem;color:var(--muted);margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip2{min-width:48px;min-height:46px;padding:6px 10px;font:inherit;font-weight:700;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip2 small{font-weight:400;font-size:.72rem;color:var(--muted)}
.chip2.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip2.on small{color:var(--accent-ink)}
.chip2.done{border-color:var(--ok)}
.locknote{margin:0 0 14px;padding:8px 12px;border-radius:3px;background:var(--warn-bg);color:var(--warn)}
.warnbox{margin:12px 0 0;padding:8px 12px;border-radius:3px;background:var(--warn-bg);color:var(--warn);max-width:68ch}
.welcome{max-width:520px}
.err{margin:6px 0 0;color:var(--bad);min-height:1.2em}
.card.done{display:flex;flex-direction:column}
.ok-line{margin:0 0 4px;color:var(--ok);font-weight:700}
.hsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:0 0 16px}
.hbox{border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--surface)}
.hbox .big-score{margin:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
caption{padding:8px 10px;text-align:left}
textarea.rep{width:100%;margin-top:12px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:8px 12px}
a.btn{display:inline-flex;align-items:center;min-height:46px;padding:10px 20px;font-weight:700;border-radius:3px;border:2px solid var(--accent);text-decoration:none;color:var(--accent)}
button.btn.danger{border-color:var(--bad);color:var(--bad)}

.band{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;background:var(--band);color:var(--band-ink);padding:22px 20px;border:1px solid var(--line)}
.band .logo{width:150px;height:auto;flex:none;color:#fff}
.band .eyebrow{color:var(--band-muted);margin:0 0 4px}
.band h1{color:#fff;margin:0 0 6px}
.band .intro{color:var(--band-muted)}
.band>div{min-width:0;flex:1 1 260px}
h2.sep{background:var(--chip);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:clamp(1.3rem,4.6vw,1.9rem);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;padding:14px 16px}
.card{background:var(--card);border:0}
.item,input.txt,select,.opt,.chip,.hbox,.tblwrap,textarea.rep,.rule{background:var(--surface)}
.facts{background:var(--chip)}
button.primary{background:var(--accent);color:var(--accent-ink)}
.tab{color:var(--ink);background:var(--surface)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.on .tstat{color:var(--accent-ink)}
.opt:has(input:checked){background:var(--chip)}
.area .chip{background:var(--chip)}
.band .teacher{margin:10px 0 0;color:#fff;font-weight:700;letter-spacing:.02em}

.wbpic{display:block;max-width:100%;height:auto;max-height:340px;border:1px solid var(--line);border-radius:3px;margin:0 0 12px;background:#fff}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:0 0 4px}
.pcell{border:1px solid var(--line);border-radius:3px;padding:8px;background:var(--surface);min-width:0}
.pcell img{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:2px;display:block;margin:0 0 6px}
.pcell .n{margin:0 0 6px;font-weight:700;color:var(--muted)}
.pcell.ok{border-color:var(--ok);background:var(--ok-bg)} .pcell.bad{border-color:var(--bad);background:var(--bad-bg)}
.pcell .fb{grid-column:auto}
.cho,.tok{min-height:44px;padding:6px 12px;font:inherit;font-size:1.02rem;color:var(--ink);background:var(--chip);border:2px solid var(--line);border-radius:3px;cursor:pointer}
.cho.on,.tok.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cho:disabled,.tok:disabled{cursor:default}
.chogrp{display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px;margin:2px 4px}
.chogrp .sl{color:var(--muted)}
.tok{min-height:40px;padding:4px 8px;margin:2px 0;background:transparent;border-color:transparent;font-size:1.08rem}
.tok:hover{border-color:var(--line)}
.tokline{line-height:2}
.punct{font-size:1.08rem}
.cl{list-style:none;margin:0 0 14px;padding:10px 12px;background:var(--chip);border-radius:3px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 12px}
.readbox{margin:0 0 14px;padding:12px 14px;background:var(--chip);border-radius:3px}
.readbox h3{margin:0 0 6px;font-family:var(--font-display);font-size:1.1rem}
.readbox p{margin:0}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:10px 12px;background:var(--chip);border-radius:3px}
.bw{padding:4px 12px;border:2px solid var(--line);border-radius:99px;background:var(--surface);font-weight:700}
textarea.wrt{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:3px;padding:8px 12px}
.btnrow.tight{margin:0 0 8px;align-items:center}
.pcellimg{}
</style>

<script>
Gate.start({kinds:['ex'],attempts:'ex'},function(ctx){

function stageOf(id){return STAGES.find(t=>id>=t.from&&id<=t.to);}
function stageLessons(t){return LESSONS.filter(L=>L.id>=t.from&&L.id<=t.to);}
const SECS=['A','E','H','J'];
const secsOf=L=>L.wb.secs||SECS;
const KIND_NAME={pics:'Pictures',match:'Match',choice:'Choose',mistake:'Find the mistake',gap:'Complete',bank:'Complete',dict:'Dictation',tf:'Reading',mkq:'Make the question',order:'Word order',free:'Writing',kw:'Key word transformation',wf:'Word formation',hd:'Matching headings'};
const SEC_NAME={Q:'Make the question',A:'Pictures',B:'Look and choose',C:'Match',D:'Find the mistake',E:'Choose',F:'True or false',G:'Read',H:'Complete',I:'Write',J:'Dictation',W:'Key word transformation',X:'Word formation',Y:'Matching headings'};
function el(tag,props){
  const e=document.createElement(tag);
  for(const k in (props||{})){const v=props[k];
    if(k==='class')e.className=v; else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,''); else if(v!==false&&v!=null)e.setAttribute(k,v);}
  for(let i=2;i<arguments.length;i++){const c=arguments[i];
    (Array.isArray(c)?c:[c]).forEach(x=>{if(x==null)return;e.append(x.nodeType?x:document.createTextNode(x));});}
  return e;
}
function norm(s){
  s=String(s).toLowerCase().replace(/[‘’`´]/g,"'");
  s=s.replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'ve\b/g,' have');
  return s.replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
const slug=s=>s.toLowerCase().replace(/ /g,'_');
const IMG='img/wb/';
function pic(src,alt,cls){return el('img',{class:cls||'wbpic',src:IMG+src,alt:alt||'',loading:'lazy'});}
function selectOf(id,label,opts){
  const s=el('select',{id:id,'aria-label':label},el('option',{value:''},'— choose —'));
  opts.forEach(o=>s.append(el('option',{value:o[0]},o[1])));return s;
}
function speak(text,rate){
  if(!('speechSynthesis' in window))return false;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=rate;
    const vs=speechSynthesis.getVoices();const v=vs.find(x=>/^en[-_]GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u);return true;}catch(e){return false;}
}

/* ---------- section builders: return {pre:[nodes], rows:[{nodes,get,lock}], grid:bool, noModel:bool} ---------- */
function bA(L,d,id){
  const rows=[];
  if(d.kind==='body'){
    const pre=[el('p',{class:'hint'},'Look at the pictures. Choose the number that matches each word.')];
    const g=el('div',{class:'pgrid'});
    d.words.forEach((w,i)=>{g.append(el('div',{class:'pcell'},pic('wb'+L.id+'_'+w+'.jpg',w),el('p',{class:'n'},'Picture '+(i+1))));});
    pre.push(g);
    d.words.forEach((w,i)=>{
      const s=selectOf(id+'r'+i,'Number for '+w,[1,2,3,4,5].map(n=>[String(n),'Picture '+n]));
      rows.push({nodes:[el('p',{class:'q'},w),s],get:()=>{const v=s.value;const m=w+' = '+d.ans[i];
        if(!v)return {ok:false,msg:'Choose a number.',model:m};return +v===d.ans[i]?{ok:true,model:m}:{ok:false,msg:'Check the model answer.',model:m};},lock:()=>{s.disabled=true;}});
    });
    return {pre:pre,rows:rows,grid:false};
  }
  const letters=d.letters;
  const pre=[el('p',{class:'facts'},el('b',{},'Words'),letters.map(x=>x[0]+' '+x[1]).join('   ·   '))];
  d.pics.forEach((w,i)=>{
    const s=selectOf(id+'r'+i,'Word for picture '+(i+1),letters.map(x=>[x[0],x[0]+'  '+x[1]]));
    const src=L.id===5?'wb5_'+slug(w)+'.jpg':'wb'+L.id+'_'+slug(w)+'.jpg';
    const ans=d.ans[i];const word=letters.find(x=>x[0]===ans)[1];
    rows.push({nodes:[pic(src,'Picture '+(i+1),'pcellimg'),el('p',{class:'n'},'Picture '+(i+1)),s],
      get:()=>{const m=ans+'  '+word;if(!s.value)return {ok:false,msg:'Choose a word.',model:m};return s.value===ans?{ok:true,model:m}:{ok:false,msg:'Check the model answer.',model:m};},lock:()=>{s.disabled=true;}});
  });
  return {pre:pre,rows:rows,grid:true};
}
function shuf(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=r[i];r[i]=r[j];r[j]=t;}return r;}
function bChoice(d,id,sceneSrc){
  let O;for(let t=0;t<30;t++){O=d.items.map(it=>shuf(it.o));if(d.items.length<2||new Set(O.map((o,i)=>o.indexOf(d.items[i].ans))).size>1)break;}
  const rows=d.items.map((it0,i)=>{
    const it=Object.assign({},it0,{o:O[i]});
    let sel=-1,locked=false;
    const btns=it.o.map((o,k)=>el('button',{type:'button',class:'cho','aria-pressed':'false',onclick:()=>{if(locked)return;sel=k;btns.forEach((b,j)=>{b.classList.toggle('on',j===k);b.setAttribute('aria-pressed',j===k?'true':'false');});}},o));
    const grp=el('span',{class:'chogrp',role:'group'});
    btns.forEach((b,k)=>{if(k)grp.append(el('span',{class:'sl'},'/'));grp.append(b);});
    const model=((it.pre?it.pre+' ':'')+it.ans+(it.post?' '+it.post:'')).replace(/\s+([.,!?])/g,'$1');
    return {nodes:[el('p',{class:'cloze'},it.pre?it.pre+' ':'',grp,it.post?(/^[.,!?]/.test(it.post)?'':' ')+it.post:'')],
      get:()=>{if(sel<0)return {ok:false,msg:'Choose an option.',model:model};return it.o[sel]===it.ans?{ok:true,model:model}:{ok:false,msg:'Check the model answer.',model:model};},
      lock:()=>{locked=true;btns.forEach(b=>{b.disabled=true;});}};
  });
  return {pre:sceneSrc?[pic(sceneSrc,'Picture')]:[],rows:rows,grid:false};
}
function bP(L,d,id){
  const pre=[el('p',{class:'facts'},el('b',{},'Words'),d.letters.map(x=>x[0]+' '+x[1]).join('   ·   '))];
  const ord=shuf(d.imgs.map((_,i)=>i));
  const rows=ord.map((oi,i)=>{
    const f=d.imgs[oi];
    const s=selectOf(id+'r'+i,'Word for picture '+(i+1),d.letters.map(x=>[x[0],x[0]+'  '+x[1]]));
    const ans=d.ans[oi];const m=ans+'  '+d.letters.find(x=>x[0]===ans)[1];
    return {nodes:[pic(f,'Picture '+(i+1),'pcellimg'),el('p',{class:'n'},'Picture '+(i+1)),s],
      get:()=>{if(!s.value)return {ok:false,msg:'Choose a word.',model:m};return s.value===ans?{ok:true,model:m}:{ok:false,msg:'Check the model answer.',model:m};},lock:()=>{s.disabled=true;}};
  });
  return {pre:pre,rows:rows,grid:true};
}
function bC(L,d,id){
  const pre=[el('ul',{class:'cl'},d.right.map(r=>el('li',{},el('b',{},r[0]),'  '+r[1])))];
  const ord=shuf(d.left.map((_,i)=>i));
  const rows=ord.map((oi,i)=>{
    const t=d.left[oi];
    const s=selectOf(id+'r'+i,'Letter for '+t,d.right.map(r=>[r[0],r[0]]));
    const a=d.ans[oi];const m=a+'  '+d.right.find(r=>r[0]===a)[1];
    return {nodes:[el('p',{class:'q'},t),s],get:()=>{if(!s.value)return {ok:false,msg:'Choose a letter.',model:m};return s.value===a?{ok:true,model:m}:{ok:false,msg:'Check the model answer.',model:m};},lock:()=>{s.disabled=true;}};
  });
  return {pre:pre,rows:rows,grid:false};
}
function bD(L,d,id){
  const rows=d.items.map((it,i)=>{
    let pick=-1,locked=false;
    const toks=it.s.match(/[\w’']+|[^\w\s]/g);
    const sent=el('p',{class:'cloze tokline'});
    const btns=[];
    toks.forEach((t,k)=>{
      if(/^[\w’']+$/.test(t)){
        const b=el('button',{type:'button',class:'tok','aria-pressed':'false',onclick:()=>{if(locked)return;pick=k;btns.forEach(x=>{x.b.classList.toggle('on',x.k===k);x.b.setAttribute('aria-pressed',x.k===k?'true':'false');});}},t);
        btns.push({b:b,k:k});sent.append(b,' ');
      }else{sent.append(el('span',{class:'punct'},t),' ');}
    });
    const inp=el('input',{type:'text',id:id+'r'+i,class:'txt',autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false','aria-label':'Correct word'});
    const model=it.good;
    return {nodes:[el('p',{class:'hint'},'Tap the wrong word, then write the correct word.'),sent,el('label',{class:'q',for:id+'r'+i},'Correct word:'),inp],
      get:()=>{
        if(pick<0)return {ok:false,msg:'Tap the wrong word first.',model:model};
        if(!inp.value.trim())return {ok:false,msg:'Write the correct word.',model:model};
        const a=it.idx.indexOf(pick)>=0,b=norm(inp.value)===norm(it.ans)||norm(inp.value)===norm(it.good);
        if(a&&b)return {ok:true,model:model};
        return {ok:false,msg:!a?'That is not the wrong word.':'Check the correct word.',model:model};},
      lock:()=>{locked=true;inp.disabled=true;btns.forEach(x=>{x.b.disabled=true;});}};
  });
  return {pre:[],rows:rows,grid:false};
}
function bTF(L,d,id,withText){
  const pre=[];
  if(withText)pre.push(el('div',{class:'readbox'},el('h3',{},d.head),el('p',{},d.text)));
  const rows=d.items.map((it,i)=>{
    const name=id+'r'+i;
    const r1=el('input',{type:'radio',name:name,id:name+'t',value:'1'}),r0=el('input',{type:'radio',name:name,id:name+'f',value:'0'});
    const m=it.ans?'True':'False';
    return {nodes:[el('p',{class:'q'},it.s),el('div',{class:'tf'},el('label',{class:'opt',for:name+'t'},r1,el('span',{},'True')),el('label',{class:'opt',for:name+'f'},r0,el('span',{},'False')))],
      get:()=>{if(!r1.checked&&!r0.checked)return {ok:false,msg:'Choose True or False.',model:m};return (r1.checked===it.ans)?{ok:true,model:m}:{ok:false,msg:'Check the model answer.',model:m};},
      lock:()=>{r1.disabled=true;r0.disabled=true;}};
  });
  return {pre:pre,rows:rows,grid:false};
}
function bH(L,d,id){
  const pre=[];if(d.instr)pre.push(el('p',{class:'hint'},d.instr));if(d.bank){let B;for(let t=0;t<30;t++){B=shuf(d.bank);if(B.length<2||B.join('|')!==d.items.map(x=>x.ans).join('|'))break;}pre.push(el('div',{class:'bank'},B.map(w=>el('span',{class:'bw'},w))));}
  const rows=d.items.map((it,i)=>{
    const parts=it.s.split('___');
    const inp=el('input',{type:'text',id:id+'r'+i,class:'txt inl',autocomplete:'off',autocapitalize:'off',autocorrect:'off',spellcheck:'false','aria-label':'Missing word'});
    const model=(parts[0]+it.ans+parts[1]).replace(/\s*\([^)]*\)/g,'');
    return {nodes:[el('p',{class:'cloze'},parts[0],inp,parts[1])],
      get:()=>{if(!inp.value.trim())return {ok:false,msg:'No answer.',model:model};return norm(inp.value)===norm(it.ans)?{ok:true,model:model}:{ok:false,msg:'Check the model answer.',model:model};},
      lock:()=>{inp.disabled=true;}};
  });
  return {pre:pre,rows:rows,grid:false};
}
function bI(L,d,id){
  const rows=d.items.map((t,i)=>{
    const ta=el('textarea',{id:id+'r'+i,class:'wrt',rows:'3','aria-label':'Your writing '+(i+1),spellcheck:'true'});
    return {nodes:[el('label',{class:'q',for:id+'r'+i},t),ta],
      get:()=>ta.value.trim().length>2?{ok:true,model:null}:{ok:false,msg:'Write something first.',model:null},lock:()=>{ta.disabled=true;}};
  });
  return {pre:[el('p',{class:'hint'},'Free writing: there is no single right answer. Your teacher can read it with you in class.')],rows:rows,grid:false,free:true};
}
let WAUD=null;
function wbAudioPath(L,i){const t=stageOf(L.id);return 'Stage '+t.n+'/Workbook/Workbook Lesson '+String(L.id).padStart(3,'0')+' J'+(i+1)+'.mp3';}
function playWb(L,i,rate,msg){
  msg.textContent='';
  if(WAUD){try{WAUD.pause();}catch(e){}}
  return Gate.audioUrl(wbAudioPath(L,i)).then(u=>{const a=new Audio(u);a.playbackRate=rate;if('preservesPitch' in a)a.preservesPitch=true;WAUD=a;
    a.onerror=()=>{msg.textContent='This audio is not available yet.';};
    const p=a.play();if(p&&p.catch)p.catch(()=>{msg.textContent='This audio is not available yet.';});
  },()=>{msg.textContent='This audio is not available yet.';});
}
function bJ(L,d,id){
  const rows=d.items.map((t,i)=>{

const hosts={};
function buildCard(L,s){
  const d=L.wb[s],id=exId(L,s);
  const spec=(KB[d.kind]||BUILD[s])(L,d,id);
  const b0=best(id);
  const form=el('form',{class:'card',id:id,'aria-labelledby':id+'-h',novalidate:true});
  form.append(el('p',{class:'lab'},'Section '+s+(d.exam?' · '+d.exam:'')+(b0!==undefined?' · best: '+b0+' of '+secTotal(L,s):'')),
    el('h2',{id:id+'-h'},d.title),...spec.pre);
  const list=el(spec.grid?'div':'ol',{class:spec.grid?'pgrid':'items'});
  const built=spec.rows.map((r,i)=>{
    const fb=el('div',{class:'fb',hidden:true,'aria-live':'polite'});
    let node;
    if(spec.grid){node=el('div',{class:'pcell'},r.nodes,fb);}
    else node=el('li',{class:'item'},el('span',{class:'n'},String(i+1)),el('div',{},r.nodes),fb);
    list.append(node);return {li:node,fb:fb,r:r,why:(d.items&&d.items[i]&&d.items[i].why)||null};
  });
  form.append(list);
  const score=el('p',{class:'score','aria-live':'polite'});
  const verify=el('button',{type:'submit',class:'btn primary'},spec.free?'Done':'Check');
  const retry=el('button',{type:'button',class:'btn ghost',onclick:()=>place(L,s,true)},spec.free?'Edit again':'Try again');
  form.append(el('div',{class:'btnrow'},verify,retry),score);
  form.addEventListener('submit',e=>{
    e.preventDefault();if(verify.disabled)return;
    let right=0;
    built.forEach(o=>{
      const r=o.r.get();
      o.li.classList.remove('ok','bad');o.li.classList.add(r.ok?'ok':'bad');
      o.fb.hidden=false;o.fb.textContent='';
      o.fb.append(el('span',{class:'mark'},spec.free?(r.ok?'✔ Written':'✖ Empty'):(r.ok?'✔ Correct':'✖ Wrong')));
      if(!r.ok&&r.msg)o.fb.append(el('p',{class:'msg'},r.msg));
      if(r.model)o.fb.append(el('p',{class:'model'},'Model answer: ',el('b',{},r.model)));
      if(!r.ok&&o.why)o.fb.append(whyBox(o.why));
      if(r.ok)right++;

    built.forEach(o=>o.r.lock());

    const att={l:L.id,e:id,s:right,t:total,at:Date.now()};

      ()=>{score.textContent='Score: '+right+' of '+total+' · NOT saved';warnEl.hidden=false;});
