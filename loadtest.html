<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Teste de carregamento · Britland Academy</title><link rel="icon" href="favicon.ico" sizes="any"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b1733"><script src="js/pwa.js" defer></script>
<link rel="stylesheet" href="js/fonts.css"><link rel="stylesheet" href="js/theme.css"><link rel="stylesheet" href="js/brand.css"><link rel="stylesheet" href="js/wm.css">
<style>
.lt{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.stage{background:radial-gradient(120% 90% at 50% 20%,#14275a,#0b1733 70%);border-radius:18px;padding:18px 0 10px;margin:14px 0;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
select,button,input{font:inherit;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line,#999);background:var(--card,#fff);color:var(--ink,#111);min-height:42px}
button.p{background:#F5C542;color:#111;border-color:#F5C542;font-weight:700}
.note{color:var(--muted,#555);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{min-height:34px;padding:4px 10px;font-size:.85rem}.chips button.on{background:#F5C542;color:#111;border-color:#F5C542}
</style></head><body><main class="lt">
<h1>Teste das animações de carregamento</h1>
<p class="note">Página só do professor. Escolha um efeito e toque em “Rodar” para ver o escudo sendo desenhado em dourado, com faíscas, seguindo um progresso simulado.</p>
<div class="stage" id="stage"></div>
<div class="row"><button class="p" id="run" type="button">▶ Rodar</button><label>Duração <select id="dur"><option value="2500">2,5 s</option><option value="5000" selected>5 s</option><option value="9000">9 s</option></select></label><label>Curso <select id="crs"><option value="en">Inglês</option><option value="es">Espanhol</option></select></label></div>
<div class="chips" id="chips" role="group" aria-label="Efeitos"></div>
<p class="note" id="info"></p>
<div class="row"><label>Simular data <input type="date" id="dt"></label><button id="pk" type="button">Ver qual efeito entra nessa data</button></div>
<p class="note" id="pkr"></p>
</main>
<script src="js/i18n.js" charset="utf-8"></script><script src="js/config.js" charset="utf-8"></script><script src="js/gate.js" charset="utf-8"></script><script src="js/loadfx.js"></script>
<script>
Gate.start({kinds:[]},function(ctx){
  if(!(ctx.profile&&ctx.profile.is_admin)){location.replace('index.html');return;}
  var E=BLLoad.EFFECTS,sel=null,ld=null,$=function(i){return document.getElementById(i);};
  var none={id:'',n:'Sem efeito (normal)',c:'en,es'};
  function chip(e){var b=document.createElement('button');b.type='button';b.textContent=e.n;b.onclick=function(){sel=e.id||null;[].forEach.call($('chips').children,function(c){c.classList.remove('on');});b.classList.add('on');$('info').textContent=e.id?('Cursos: '+(e.c==='en,es'?'inglês e espanhol':e.c==='en'?'só inglês':'só espanhol')):'';run();};return b;}
  [none].concat(E).forEach(function(e){$('chips').appendChild(chip(e));});
  $('chips').children[0].classList.add('on');
  var timer=0;
  function run(){
    if(ld)ld.destroy();clearInterval(timer);
    ld=BLLoad.mount($('stage'),{effect:sel,course:$('crs').value});
    var t0=performance.now(),d=+$('dur').value;
    timer=setInterval(function(){var u=(performance.now()-t0)/d;/* progresso irregular, como um carregamento real */var p=Math.min(1,u<.5?u*1.3:.65+(u-.5)*.7);ld.progress(p);if(u>=1){clearInterval(timer);ld.finish();}},60);
  }
  $('run').onclick=run;$('crs').onchange=run;
  $('dt').value=new Date().toISOString().slice(0,10);
  $('pk').onclick=function(){var v=$('dt').value.split('-');var d=new Date(+v[0],+v[1]-1,+v[2]);var id=BLLoad.pick(d,$('crs').value,null);var e=E.filter(function(x){return x.id===id})[0];$('pkr').textContent=e?('Nessa data entra: '+e.n):'Nessa data: logo normal, sem efeito.';};
  run();
});
</script></body></html>
