<link rel="stylesheet" href="js/fonts.css"><style>
:root{--bg:#fff;--card:#ececec;--surface:#fff;--ink:#111;--muted:#4d4d4d;--line:#b8b8b8;--accent:#111;--accent-ink:#fff;--band:#000;--band-ink:#fff;--ok:#1d5e2e;--ok-bg:#e3efe5;--bad:#9c2a22;--bad-bg:#f6e4e2;--warn:#6b4a00;--warn-bg:#f3ead0;--font-body:'FreeSet','Helvetica Neue',Arial,sans-serif}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.wrap{max-width:1120px;margin:0 auto}
.band{background:var(--band);color:var(--band-ink);padding:20px;margin:0 0 18px}
.band p{margin:0;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:#cfcfcf}
h1{margin:4px 0 0;font-size:clamp(1.5rem,5vw,2.2rem);line-height:1.15}
h2{font-size:1.25rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:16px;margin:0 0 18px}
.hint{color:var(--muted);font-size:.92rem;margin:6px 0}

.tw{overflow-x:auto;margin:8px 0;background:var(--surface)}

.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}

<style>
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}

.hero .hi{flex:1;min-width:180px}

.rings small{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}

.md.on svg{color:var(--accent)}.md.off{opacity:.38;filter:grayscale(1)}
.sp{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.92rem}
.sp>span:first-child{width:74px;flex:none;font-weight:700}.sp .bar{flex:1;margin:0}.sp>span:last-child{width:44px;text-align:right;color:var(--muted)}

.choices button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px!important;padding:12px;font:inherit;font-weight:700;cursor:pointer;min-height:48px;justify-content:center}
.choices button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.smp{background:var(--surface);border-radius:14px;padding:10px 14px;margin-top:8px}
</style>

<script>
Gate.start({kinds:[]},function(ctx){
if(Gate.gameOn()){location.replace('index.html#profile');return;}
'use strict';
const sb=Gate.sb,el=Gate.el,$=id=>document.getElementById(id);
const SYM={EUR:'€',BRL:'R$'};
const COURSE=window.BL_COURSE||{};
const STG=COURSE.stages||[[1,12],[13,27],[28,44],[45,63],[64,82],[83,101],[102,120],[121,138],[139,156],[157,174],[175,190],[191,206],[1001,1017]];
function money(v,c){return (SYM[c]||'')+' '+Number(v).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});}
function dt(s){if(!s)return '';const d=new Date(s.length<=10?s+'T12:00:00':s);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function th(l){return el('thead',{},el('tr',{},l.map(h=>el('th',{scope:'col'},h))));}
function pct(s,t){return t?Math.round(s/t*100)+'%':'—';}
function show(w){['g','p','s'].forEach(k=>{$('p-'+k).hidden=k!==w;$('t-'+k).setAttribute('aria-selected',String(k===w));});}
$('t-g').addEventListener('click',()=>show('g'));$('t-p').addEventListener('click',()=>show('p'));$('t-s').addEventListener('click',()=>show('s'));
const me=ctx.profile||{};
$('hn').textContent=me.name||'';$('hs').textContent=COURSE.name||'Callan English';
function openPic(){Gate.loadProfile(()=>Profile.openPicker({sb:sb,uid:me.id||ctx.user.id,current:me.avatar,lang:COURSE.uiLang||'en',onSaved:id=>{me.avatar=id;Gate.setAvatar(id);}}));}
$('edav').addEventListener('click',openPic);$('chg').addEventListener('click',openPic);
Gate.loadProfile(()=>{Gate.setAvatar(me.avatar||null);if(location.hash==='#picture'){history.replaceState(null,'',location.pathname+location.search);openPic();}});
function themeUi(){const t=Gate.theme();document.querySelectorAll('#thm button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===t)));}
document.querySelectorAll('#thm button').forEach(b=>b.addEventListener('click',()=>{Gate.setTheme(b.dataset.v);themeUi();}));themeUi();
document.querySelectorAll('#sz button').forEach(b=>b.addEventListener('click',()=>Gate.setSize(Gate.sizeIdx()+(+b.dataset.d))));

async function grades(){const b=$('g');Gate.skel(b,3,52);try{await grades0();}finally{Gate.unskel(b);}}
function svgH(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function ring(p,txt,lab){const R=34,C=2*Math.PI*R,v=Math.max(0,Math.min(1,p));
  const w=el('div',{});w.append(svgH('<svg viewBox="0 0 92 92" role="img" aria-label="'+txt+'"><circle cx="46" cy="46" r="'+R+'" fill="none" stroke="var(--line)" stroke-width="9"/><circle cx="46" cy="46" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(C*v).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 46 46)"/><text class="rt" x="46" y="53" text-anchor="middle">'+txt+'</text></svg>'),el('small',{},lab));return w;}
const MD=[
 ['First check','M5 13l4 4L19 7'],
 ['10 checks','M4 19V9M10 19V5M16 19v-7M21 19H3'],
 ['Perfect score','M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'],
 ['7 days in a row','M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z'],
 ['Stage finished','M5 21V4M5 4h12l-2 4 2 4H5'],
 ['Workbook','M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM8 17h11'],
 ['50 exercises','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2'],
 ['Top student','M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 21h8']];
async function grades0(){
  const box=$('g'),all=[];let from=0;
  for(;;){const r=await sb.from('attempts').select('kind,lesson,ex,score,total,created_at').order('created_at',{ascending:true}).range(from,from+999);
    if(r.error){box.append(el('p',{class:'msg bad'},'Could not load your grades: '+r.error.message));return;}
    all.push(...(r.data||[]));if((r.data||[]).length<1000)break;from+=1000;}
  if(!all.length){box.append(el('p',{class:'hint'},'Your grades will appear here after your first Lesson Check or exercise.'));return;}
  const best={};all.forEach(a=>{const k=(a.kind==='ex'&&/^wb/.test(String(a.ex))?'wb':a.kind)+'|'+a.lesson+'|'+a.ex;
    const o=best[k]||(best[k]={kind:a.kind==='ex'&&/^wb/.test(String(a.ex))?'wb':a.kind,lesson:a.lesson,s:0,t:a.total,last:a.created_at,n:0});
    if(a.score>o.s||(a.score===o.s&&a.total>o.t)){o.s=a.score;o.t=a.total;}o.n++;if(a.created_at>o.last)o.last=a.created_at;});
  const per={};Object.values(best).forEach(o=>{const l=per[o.lesson]||(per[o.lesson]={lesson:o.lesson,check:null,ex:{s:0,t:0},wb:{s:0,t:0},last:''});
    if(o.kind==='check')l.check={s:o.s,t:o.t};else if(o.kind==='wb'){l.wb.s+=o.s;l.wb.t+=o.t;}else{l.ex.s+=o.s;l.ex.t+=o.t;}
    if(o.last>l.last)l.last=o.last;});
  const L=Object.values(per);let cs=0,ct=0;L.forEach(l=>{if(l.check){cs+=l.check.s;ct+=l.check.t;}});
  const done=L.filter(l=>l.check).length;
  /* streak (days with any activity) */
  const days=new Set(all.map(a=>iso(new Date(a.created_at))));
  let cur=0,d0=new Date();if(!days.has(iso(d0)))d0.setDate(d0.getDate()-1);
  while(days.has(iso(d0))){cur++;d0.setDate(d0.getDate()-1);}
  const sorted=[...days].sort();let mx=0,run=0,prev=null;
  sorted.forEach(x=>{const t=new Date(x+'T12:00:00').getTime();run=(prev!==null&&Math.round((t-prev)/864e5)===1)?run+1:1;prev=t;if(run>mx)mx=run;});
  /* hero: stage progress */
  let si=-1;STG.forEach((r,i)=>{if(L.some(l=>l.check&&l.lesson>=r[0]&&l.lesson<=r[1]))si=i;});
  if(si>=0){const r=STG[si],n=L.filter(l=>l.check&&l.lesson>=r[0]&&l.lesson<=r[1]).length,tot=r[1]-r[0]+1,p=Math.round(n/tot*100);
    $('hbar').hidden=false;$('hbar').firstChild.style.width=p+'%';
    $('hbt').textContent=r[0]>1000?'Business · '+p+'%':'Stage '+(si+1)+' · '+p+'%';}
  /* rings */
  box.append(el('div',{class:'rings'},ring(ct?cs/ct:0,pct(cs,ct),'Lesson Check average'),ring(Math.min(1,done/STG.reduce((x,r)=>x+(r[1]-r[0]+1),0)*8),String(done),'Lesson Checks done'),ring(Math.min(1,cur/7),String(cur),'Days in a row')));
  /* weekly chart */
  const W=8,now=new Date();now.setHours(0,0,0,0);const wk=Array(W).fill(0);
  all.forEach(a=>{const t=new Date(a.created_at);t.setHours(0,0,0,0);const k=Math.floor((now-t)/864e5/7);if(k>=0&&k<W)wk[W-1-k]++;});
  const mxw=Math.max(1,...wk),pts=wk.map((v,i)=>[10+i*(300/(W-1)),82-(v/mxw)*66]);
  box.append(el('h3',{class:'sec'},'Activity per week'));
  const ch=el('div',{class:'chart'});ch.append(svgH('<svg viewBox="0 0 320 96" role="img" aria-label="Activity per week"><polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--accent)"/>').join('')+'</svg>'));
  ch.append(el('div',{class:'ax'},el('span',{},'8'),el('span',{},'0')));
  ch.lastChild.firstChild.textContent='−8 w';ch.lastChild.lastChild.textContent='now';box.append(ch);
  /* medals */
  const perfect=Object.values(best).some(o=>o.kind==='check'&&o.t&&o.s===o.t);
  const stageDone=STG.some(r=>{const n=L.filter(l=>l.check&&l.lesson>=r[0]&&l.lesson<=r[1]).length;return n>=(r[1]-r[0]+1);});
  const exN=all.filter(a=>a.kind==='ex').length;
  const has=[done>=1,done>=10,perfect,mx>=7,stageDone,all.some(a=>a.kind==='ex'&&/^wb/.test(String(a.ex))),exN>=50,done>=5&&ct&&cs/ct>=.9];
  const prog=[done?1:0,Math.min(1,done/10),perfect?1:0,Math.min(1,mx/7),0,0,Math.min(1,exN/50),done>=5&&ct?Math.min(1,cs/ct/.9):0];
  box.append(el('h3',{class:'sec'},'Medals'));
  const mg=el('div',{class:'medals'});MD.forEach((m,i)=>{const d=el('div',{class:'md '+(has[i]?'on':'off')});d.append(svgH('<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" /><g transform="translate(4.8 4.8) scale(.6)"><path d="'+m[1]+'"/></g></svg>'),el('span',{},m[0]));mg.append(d);});box.append(mg);
  let nx=-1,np=-1;has.forEach((h,i)=>{if(!h&&prog[i]>np){np=prog[i];nx=i;}});
  if(nx>=0){const nb=el('div',{class:'pbar'},el('span',{class:'sm'},'Next medal'),el('b',{},' · '+MD[nx][0]),el('div',{class:'bar'},el('i',{style:'width:'+Math.round(np*100)+'%'})));
    nb.querySelector('b').firstChild.textContent=' · ';nb.querySelector('b').append('');box.append(nb);
    const bb=nb.querySelector('b');bb.textContent='';bb.append(' · ',el('span',{},MD[nx][0]));}
  /* progress by stage */
  const sg=[];STG.forEach((r,i)=>{const n=L.filter(l=>l.check&&l.lesson>=r[0]&&l.lesson<=r[1]).length;if(!n)return;
    let s=0,t=0;L.forEach(l=>{if(l.check&&l.lesson>=r[0]&&l.lesson<=r[1]){s+=l.check.s;t+=l.check.t;}});
    sg.push(el('div',{class:'sp'},el('span',{},r[0]>1000?'Business':'Stage '+(i+1)),el('div',{class:'bar'},el('i',{style:'width:'+Math.round(n/(r[1]-r[0]+1)*100)+'%'})),el('span',{},pct(s,t))));});
  if(sg.length){box.append(el('h3',{class:'sec'},'Progress by Stage'));sg.forEach(x=>box.append(x));}
  /* full table, collapsed */
  const all2=el('details',{class:'allg'});all2.append(el('summary',{},'See all grades'));
